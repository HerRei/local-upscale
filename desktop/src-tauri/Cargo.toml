[package]
name = "localsr-next"
version = "0.1.3-beta"
description = "LocalSR desktop control plane"
authors = ["Hermes Reisner"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "localsr_next_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "localsr-next"
path = "src/main.rs"

[features]
microsoft-store = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
directories = "6.0.0"
futures-util = "0.3.34"
fs2 = "0.4.3"
flate2 = "1.1"
tar = "0.4"
open = { version = "5.4.2", features = ["shellexecute-on-windows"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-updater = "2"
minisign-verify = "0.2"
semver = "1"
tempfile = "3.23.0"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.3"
thiserror = "2.0.20"
tokio = { version = "1.48.0", features = ["fs", "io-util", "sync", "time"] }
tower-http = { version = "0.6.11", features = ["fs"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }

[lints.rust]
dead_code = "deny"
