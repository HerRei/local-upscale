name: Isolated Windows acceptance

# Deliberately uses a disposable hosted VM, never the shared release runners.
on:
  push:
    branches: [codex/platform-acceptance]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      CARGO_BUILD_JOBS: '2'
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install CPU test environment
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check --no-cache-dir -e '.[dev,video,face,package]'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build/acceptance | Out-Null
      - name: Python suite
        run: python -m pytest tests -q --tb=short --junitxml=build/acceptance/windows-tests.xml
      - name: Frontend and native tests
        if: success() || failure()
        run: |
          npm --prefix desktop ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix desktop run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix desktop test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix desktop run build:frontend
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Freeze and exercise installed worker
        if: success() || failure()
        run: |
          python -m PyInstaller --noconfirm --clean --distpath build/acceptance/dist --workpath build/acceptance/pyinstaller packaging/tauri_worker.spec
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python packaging/smoke_worker.py build/acceptance/dist/engine/localsr-worker.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/acceptance_worker.py build/acceptance/dist/engine/localsr-worker.exe --device cpu --report build/acceptance/windows-worker.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native host startup with bundled engine
        if: success() || failure()
        run: |
          cargo build --manifest-path desktop/src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item -Recurse build/acceptance/dist/engine desktop/src-tauri/target/debug/engine
          $app = Resolve-Path desktop/src-tauri/target/debug/localsr-next.exe
          foreach ($mode in @('headless-smoke-test', 'smoke-test')) {
            $env:LOCALSR_SMOKE_REPORT = Join-Path $env:GITHUB_WORKSPACE "build/acceptance/windows-$mode.json"
            $process = Start-Process -FilePath $app -ArgumentList "--$mode" -PassThru
            if (-not $process.WaitForExit(180000)) {
              Stop-Process -Id $process.Id -Force
              throw "Native host timed out: $mode"
            }
            if ($process.ExitCode -ne 0) { throw "Native host failed: $mode" }
            $report = Get-Content $env:LOCALSR_SMOKE_REPORT -Raw | ConvertFrom-Json
            if (-not $report.passed) { throw "Native host handshake failed: $mode" }
          }
      - name: Save reports in the job log and summary
        if: always()
        run: |
          foreach ($file in Get-ChildItem build/acceptance/*.json) {
            $text = Get-Content $file.FullName -Raw
            Write-Output $text
            Add-Content $env:GITHUB_STEP_SUMMARY "### $($file.Name)"
            Add-Content $env:GITHUB_STEP_SUMMARY ('```json' + "`n" + $text + "`n" + '```')
          }
