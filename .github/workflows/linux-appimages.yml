name: Linux AppImages

# Builds the Linux CPU, NVIDIA CUDA and AMD ROCm AppImages on GitHub-hosted runners,
# which have the disk space the licensing-clean media runtime needs. An AppImage uses the
# host's glibc and runs only where it is at least as new as the build host's, so CPU and
# CUDA build on Ubuntu 22.04, the oldest LTS still in standard support, which AppImageHub
# (the AppImage catalog) tests on. ROCm stays on 24.04: its frozen PyTorch worker
# deadlocks in import torch with 22.04's glibc 2.35 (rocprofiler-sdk waits for a thread
# that waits for the loader lock). Every AppImage must need at most its runner's glibc and
# show its window without network within AppImageHub's 30 seconds. The media
# runtime is built from the pinned LGPL sources, and build_tauri_preview.py refuses any
# media runtime or AppImage outside packaging/ffmpeg/codec-policy.json; this workflow
# never passes --private-preview-media. Each AppImage gets its corresponding source
# bundle (LocalSR, the media runtime, OpenCV, LibRaw, the GCC runtime and Ubuntu sources
# for the bundled LGPL host libraries). The ROCm wheel's own libnuma and libelf are
# swapped for this runner's Ubuntu copies so those sources correspond, and every
# AppImage must pass the NVIDIA redistribution policy. Given a release tag, the verified
# AppImages (split into 1.9 GB parts when larger than GitHub's asset limit) and their
# bundles are attached.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release to attach the AppImages to (empty keeps them as artifacts)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: linux-appimages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    name: Build Linux x86_64 ${{ matrix.backend }} AppImage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64-rocm
            backend: AMD-ROCm
            suffix: Linux-ROCm-x86_64.AppImage
            source: Linux-ROCm-source-and-notices.tar.gz
            runner: ubuntu-24.04
            glibc: "2.39"
            elf_packages: libelf1t64 libdw1t64
    env:
      PIP_VERSION: "26.2.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Free disk space and keep build trees on the large disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null || true
          sudo mkdir -p /mnt/lsr
          sudo chown "$(id -u):$(id -g)" /mnt/lsr
          mkdir -p /mnt/lsr/tmp /mnt/lsr/pip /mnt/lsr/cargo-target /mnt/lsr/build /mnt/lsr/out
          ln -s /mnt/lsr/build build
          {
            echo "TMPDIR=/mnt/lsr/tmp"
            echo "PIP_CACHE_DIR=/mnt/lsr/pip"
            echo "CARGO_TARGET_DIR=/mnt/lsr/cargo-target"
          } >> "$GITHUB_ENV"
          df -h / /mnt

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Create the build environment
        run: |
          python -m venv /mnt/lsr/venv
          echo "/mnt/lsr/venv/bin" >> "$GITHUB_PATH"

      - name: Validate release identity
        run: |
          python scripts/check_release_version.py
          python scripts/check_desktop_architecture.py
          python scripts/export_desktop_catalog.py --check

      - name: Install native packaging dependencies and the locked backend
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            xdg-utils xvfb dbus-x11 xdotool imagemagick librdmacm1 libibverbs1 squashfs-tools \
            nasm meson ninja-build cmake autoconf automake libtool zlib1g-dev patch \
            libnuma1 ${{ matrix.elf_packages }}
          python -m pip install --disable-pip-version-check "pip==${PIP_VERSION}"
          python scripts/backend_wheelhouse.py --target "${{ matrix.id }}" \
            --cache-root /mnt/lsr/wheelhouses --report /mnt/lsr/out/dependency-wheelhouse.json
          python -m pip check
          npm ci --prefix desktop

      - name: Replace PyPI media wheels with the licensing-clean runtime
        run: |
          python packaging/ffmpeg/install_media_runtime.py \
            --work-dir /mnt/lsr/lgpl-media/linux-x86_64 --source-cache /mnt/lsr/lgpl-media/sources --jobs 4

      - name: Install the Vulkan SDK for the CUDA and ROCm editing runtime
        if: matrix.backend != 'CPU'
        env:
          VULKAN_SDK_VERSION: "1.4.363.1"
          VULKAN_SDK_SHA256: b7867d8ca658563813af666f34b93db87f1b1c7d9d69d97e924c210c7ba33eb8
        run: |
          # stable-diffusion.cpp's Vulkan backend is built from source here, because its
          # prebuilt Linux binaries need Ubuntu 24.04's glibc; Ubuntu 22.04's Vulkan headers
          # and its shaderc are too old for it. It links against Ubuntu's loader (the SDK
          # keeps its own outside CMake's search path), older than the SDK's, so sd-cli
          # loads with any Vulkan loader since Ubuntu 22.04.
          sudo apt-get install -y libvulkan-dev
          ARCHIVE="/mnt/lsr/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          curl -fsSL --retry 3 -o "$ARCHIVE" \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          echo "${VULKAN_SDK_SHA256}  ${ARCHIVE}" | sha256sum --check
          mkdir -p /mnt/lsr/vulkan-sdk
          tar -C /mnt/lsr/vulkan-sdk -xJf "$ARCHIVE"
          rm "$ARCHIVE"
          SDK="/mnt/lsr/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64"
          "$SDK/bin/glslc" --version
          echo "VULKAN_SDK=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/bin" >> "$GITHUB_PATH"

      - name: Build, verify and smoke-test the AppImage
        run: |
          python scripts/build_tauri_preview.py --skip-checks --bundles appimage
          BUNDLE="$CARGO_TARGET_DIR/release/bundle/appimage"
          SOURCE=$(find "$BUNDLE" -maxdepth 1 -type f -name '*.AppImage')
          test "$(printf '%s\n' "$SOURCE" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          NAME="LocalSR-v${VERSION}-${{ matrix.suffix }}"
          ARTIFACT="/mnt/lsr/out/$NAME"
          mv "$SOURCE" "$ARTIFACT"
          chmod +x "$ARTIFACT"
          python scripts/verify_codec_allowlist.py --tree "$BUNDLE" --output "/mnt/lsr/out/$NAME.codec-policy.json"
          # Temporary: where and why the ROCm worker hangs (reverted in the next commit).
          sudo apt-get install -y gdb
          python -m pip install --disable-pip-version-check "py-spy==0.4.1"
          bash .github/debug-rocm-hang.sh "$ARTIFACT"  # ends the job (exit 1) after its experiments
          python scripts/verify_tauri_release_package.py "$ARTIFACT" \
            --platform linux --architecture x86_64 --report "/mnt/lsr/out/$NAME.architecture.json"
          mkdir -p /mnt/lsr/extract
          (cd /mnt/lsr/extract && "$ARTIFACT" --appimage-extract > /dev/null)
          # What AppImageHub tests: the glibc every ELF file needs, and a window without network.
          python scripts/verify_appimage_libc.py /mnt/lsr/extract/squashfs-root --appimage "$ARTIFACT" \
            --max "${{ matrix.glibc }}" --report "/mnt/lsr/out/$NAME.libc.json"
          python scripts/verify_appimage_window.py --appdir /mnt/lsr/extract/squashfs-root \
            --appimage "$ARTIFACT" --screenshot "/mnt/lsr/out/$NAME.offline-window.png" \
            --report "/mnt/lsr/out/$NAME.offline-window.json"
          # Corresponding source for exactly what the AppImage contains.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then # 24.04: deb822
            sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          else
            sed -n 's/^deb /deb-src /p' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/deb-src.list
            test -s /etc/apt/sources.list.d/deb-src.list
          fi
          sudo apt-get update
          python scripts/verify_nvidia_redistributables.py /mnt/lsr/extract/squashfs-root \
            | tee "/mnt/lsr/out/$NAME.nvidia.json"
          mapfile -t EXTRA < <(python scripts/fetch_extra_sources.py --platform linux-x86_64 \
            --destination /mnt/lsr/extra-sources)
          SOURCE_NAME="LocalSR-v${VERSION}-${{ matrix.source }}"
          python scripts/build_source_bundle.py --inventory /mnt/lsr/extract/squashfs-root \
            --output /mnt/lsr/source --commit "$GITHUB_SHA" \
            --media-source /mnt/lsr/lgpl-media/linux-x86_64/dist/corresponding-source \
            --opencv-source /mnt/lsr/lgpl-media/linux-x86_64/opencv/corresponding-source \
            "${EXTRA[@]}" --apt-sources > "/mnt/lsr/out/$SOURCE_NAME.json"
          tar -C /mnt/lsr -czf "/mnt/lsr/out/$SOURCE_NAME" source
          rm -rf /mnt/lsr/extract /mnt/lsr/source
          cd /mnt/lsr/out
          sha256sum "$NAME" > "$NAME.sha256"
          if [ "$(stat -c %s "$NAME")" -gt 2000000000 ]; then
            split --bytes=1900M --numeric-suffixes=1 --suffix-length=4 "$NAME" "$NAME.part-"
            rm "$NAME"
          fi
          ls -la /mnt/lsr/out
          df -h / /mnt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.id }}
          path: /mnt/lsr/out/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  attach:
    name: Attach verified AppImages to the release
    needs: appimage
    if: ${{ !cancelled() && inputs.release_tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: assets
          merge-multiple: true
      - name: Upload the AppImages and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          shopt -s nullglob
          files=(assets/*.AppImage assets/*.AppImage.part-* assets/*.AppImage.sha256 \
            assets/*-source-and-notices.tar.gz)
          test "${#files[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
