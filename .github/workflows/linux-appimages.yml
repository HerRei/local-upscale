name: Linux AppImages

# Builds the Linux CPU, NVIDIA CUDA and AMD ROCm AppImages on GitHub-hosted runners,
# which have the disk space the licensing-clean media runtime needs. They run Ubuntu 22.04,
# the oldest LTS still in standard support: an AppImage uses the host's glibc and runs only
# where it is at least as new as the build host's, and AppImageHub (the AppImage catalog)
# tests on that release. Every AppImage must need at most glibc 2.35 and show its window
# without network within AppImageHub's 30 seconds. The media
# runtime is built from the pinned LGPL sources, and build_tauri_preview.py refuses any
# media runtime or AppImage outside packaging/ffmpeg/codec-policy.json; this workflow
# never passes --private-preview-media. Each AppImage gets its corresponding source
# bundle (LocalSR, the media runtime, OpenCV, LibRaw, the GCC runtime and Ubuntu sources
# for the bundled LGPL host libraries). The ROCm wheel's own libnuma and libelf are
# swapped for this runner's Ubuntu copies so those sources correspond, and every
# AppImage must pass the NVIDIA redistribution policy. Every AppImage carries its update
# identity (updater public key, backend, kind, engine id), so it checks its own feed
# entry; the AppImage is its own updater file, and its engine package is written next to
# it. Their signatures are made on the Mac (scripts/beta_update_signing.py platforms).
# The CPU job also builds the .deb for Ubuntu and Debian from the same worker, with the same
# codec, NVIDIA, glibc and source checks, a check that its Depends bring every system
# library it links, and an install, start and removal with apt. It has its own update kind
# (`deb`) and no feed entry: apt installs its updates, and GPU engines come from the app.
# Given a release tag, the verified AppImages (split into 1.9 GB parts when larger than
# GitHub's asset limit), the .deb, engine packages and bundles are attached.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release to attach the AppImages to (empty keeps them as artifacts)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: linux-appimages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    name: Build Linux x86_64 ${{ matrix.backend }} AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64-cpu
            backend: CPU
            suffix: Linux-CPU-x86_64.AppImage
            source: Linux-CPU-source-and-notices.tar.gz
          - id: linux-x86_64-cuda
            backend: CUDA
            suffix: Linux-CUDA-x86_64.AppImage
            source: Linux-CUDA-source-and-notices.tar.gz
          - id: linux-x86_64-rocm
            backend: AMD-ROCm
            suffix: Linux-ROCm-x86_64.AppImage
            source: Linux-ROCm-source-and-notices.tar.gz
    env:
      PIP_VERSION: "26.2.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Free disk space and keep build trees on the large disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null || true
          sudo mkdir -p /mnt/lsr
          sudo chown "$(id -u):$(id -g)" /mnt/lsr
          mkdir -p /mnt/lsr/tmp /mnt/lsr/pip /mnt/lsr/cargo-target /mnt/lsr/build /mnt/lsr/out
          ln -s /mnt/lsr/build build
          {
            echo "TMPDIR=/mnt/lsr/tmp"
            echo "PIP_CACHE_DIR=/mnt/lsr/pip"
            echo "CARGO_TARGET_DIR=/mnt/lsr/cargo-target"
          } >> "$GITHUB_ENV"
          df -h / /mnt

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Create the build environment
        run: |
          python -m venv /mnt/lsr/venv
          echo "/mnt/lsr/venv/bin" >> "$GITHUB_PATH"

      - name: Validate release identity
        run: |
          python scripts/check_release_version.py
          python scripts/check_desktop_architecture.py
          python scripts/export_desktop_catalog.py --check

      - name: Give the build its update identity
        run: |
          # Compiled into the host: without them it never checks its feed and shows no
          # update switches.
          python scripts/release_targets.py --update-env "${{ matrix.id }}" --commit "$GITHUB_SHA" \
            >> "$GITHUB_ENV"

      - name: Install native packaging dependencies and the locked backend
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            xdg-utils xvfb dbus-x11 xdotool imagemagick librdmacm1 libibverbs1 squashfs-tools \
            nasm meson ninja-build cmake autoconf automake libtool zlib1g-dev patch \
            libnuma1 libelf1 libdw1 ocl-icd-libopencl1
          python -m pip install --disable-pip-version-check "pip==${PIP_VERSION}"
          python scripts/backend_wheelhouse.py --target "${{ matrix.id }}" \
            --cache-root /mnt/lsr/wheelhouses --report /mnt/lsr/out/dependency-wheelhouse.json
          python -m pip check
          npm ci --prefix desktop

      - name: Replace PyPI media wheels with the licensing-clean runtime
        run: |
          python packaging/ffmpeg/install_media_runtime.py \
            --work-dir /mnt/lsr/lgpl-media/linux-x86_64 --source-cache /mnt/lsr/lgpl-media/sources --jobs 4

      - name: Install the Vulkan SDK for the CUDA and ROCm editing runtime
        if: matrix.backend != 'CPU'
        env:
          VULKAN_SDK_VERSION: "1.4.363.1"
          VULKAN_SDK_SHA256: b7867d8ca658563813af666f34b93db87f1b1c7d9d69d97e924c210c7ba33eb8
        run: |
          # stable-diffusion.cpp's Vulkan backend is built from source here, because its
          # prebuilt Linux binaries need Ubuntu 24.04's glibc; Ubuntu 22.04's Vulkan headers
          # and its shaderc are too old for it. It links against Ubuntu's loader (the SDK
          # keeps its own outside CMake's search path), older than the SDK's, so sd-cli
          # loads with any Vulkan loader since Ubuntu 22.04.
          sudo apt-get install -y libvulkan-dev
          ARCHIVE="/mnt/lsr/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          curl -fsSL --retry 3 -o "$ARCHIVE" \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          echo "${VULKAN_SDK_SHA256}  ${ARCHIVE}" | sha256sum --check
          mkdir -p /mnt/lsr/vulkan-sdk
          tar -C /mnt/lsr/vulkan-sdk -xJf "$ARCHIVE"
          rm "$ARCHIVE"
          SDK="/mnt/lsr/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64"
          "$SDK/bin/glslc" --version
          echo "VULKAN_SDK=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/bin" >> "$GITHUB_PATH"

      - name: Build, verify and smoke-test the AppImage
        run: |
          python scripts/build_tauri_preview.py --skip-checks --bundles appimage
          if [ "${{ matrix.backend }}" = CUDA ]; then
            build/tauri-preview/worker-dist/engine/localsr-worker --check-cuda-arch
          fi
          BUNDLE="$CARGO_TARGET_DIR/release/bundle/appimage"
          SOURCE=$(find "$BUNDLE" -maxdepth 1 -type f -name '*.AppImage')
          test "$(printf '%s\n' "$SOURCE" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          NAME="LocalSR-v${VERSION}-${{ matrix.suffix }}"
          ARTIFACT="/mnt/lsr/out/$NAME"
          mv "$SOURCE" "$ARTIFACT"
          chmod +x "$ARTIFACT"
          python scripts/verify_codec_allowlist.py --tree "$BUNDLE" --output "/mnt/lsr/out/$NAME.codec-policy.json"
          python scripts/smoke_tauri_installer.py --backend "${{ matrix.backend }}" --timeout 900 \
            --artifact-glob "$ARTIFACT" --report "/mnt/lsr/out/$NAME.smoke.json" \
            --update-target "${{ matrix.id }}" --commit "$GITHUB_SHA"
          python scripts/verify_tauri_release_package.py "$ARTIFACT" \
            --platform linux --architecture x86_64 --report "/mnt/lsr/out/$NAME.architecture.json"
          mkdir -p /mnt/lsr/extract
          (cd /mnt/lsr/extract && "$ARTIFACT" --appimage-extract > /dev/null)
          # What AppImageHub tests: the glibc every ELF file needs, and a window without network.
          python scripts/verify_appimage_libc.py /mnt/lsr/extract/squashfs-root --appimage "$ARTIFACT" \
            --report "/mnt/lsr/out/$NAME.libc.json"
          python scripts/verify_appimage_window.py --appdir /mnt/lsr/extract/squashfs-root \
            --appimage "$ARTIFACT" --screenshot "/mnt/lsr/out/$NAME.offline-window.png" \
            --report "/mnt/lsr/out/$NAME.offline-window.json"
          # Corresponding source for exactly what the AppImage contains.
          sed -n 's/^deb /deb-src /p' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/deb-src.list
          test -s /etc/apt/sources.list.d/deb-src.list
          sudo apt-get update
          python scripts/verify_nvidia_redistributables.py /mnt/lsr/extract/squashfs-root \
            | tee "/mnt/lsr/out/$NAME.nvidia.json"
          mapfile -t EXTRA < <(python scripts/fetch_extra_sources.py --platform linux-x86_64 \
            --destination /mnt/lsr/extra-sources)
          SOURCE_NAME="LocalSR-v${VERSION}-${{ matrix.source }}"
          python scripts/build_source_bundle.py --inventory /mnt/lsr/extract/squashfs-root \
            --output /mnt/lsr/source --commit "$GITHUB_SHA" \
            --media-source /mnt/lsr/lgpl-media/linux-x86_64/dist/corresponding-source \
            --opencv-source /mnt/lsr/lgpl-media/linux-x86_64/opencv/corresponding-source \
            "${EXTRA[@]}" --apt-sources > "/mnt/lsr/out/$SOURCE_NAME.json"
          tar -C /mnt/lsr -czf "/mnt/lsr/out/$SOURCE_NAME" source
          rm -rf /mnt/lsr/extract /mnt/lsr/source
          cd /mnt/lsr/out
          sha256sum "$NAME" > "$NAME.sha256"
          if [ "$(stat -c %s "$NAME")" -gt 2000000000 ]; then
            split --bytes=1900M --numeric-suffixes=1 --suffix-length=4 "$NAME" "$NAME.part-"
            rm "$NAME"
          fi
          # The updater's engine package, installed as the versioned engine by an update.
          # Written after the split so the two copies of the AppImage never share the disk
          # with it.
          python "$GITHUB_WORKSPACE/scripts/prepare_engine_payload.py" --target "${{ matrix.id }}" \
            --output /mnt/lsr/out --engine "$GITHUB_WORKSPACE/build/tauri-preview/worker-dist/engine"
          ls -la /mnt/lsr/out
          df -h / /mnt

      - name: Give the CPU .deb its update identity
        if: matrix.backend == 'CPU'
        run: |
          # The CPU AppImage's worker and engine id, with the `deb` kind: apt installs and
          # removes its files, so the app only reports new versions (docs/updates.md).
          python scripts/release_targets.py --update-env linux-x86_64-cpu-deb --commit "$GITHUB_SHA" \
            >> "$GITHUB_ENV"

      - name: Build, verify and smoke-test the CPU .deb
        if: matrix.backend == 'CPU'
        run: |
          # Reuses the worker built above; Tauri's deb bundler adds the host compiled with
          # the .deb's identity. WebKitGTK, GTK and GStreamer come from the system.
          python scripts/build_tauri_preview.py --skip-worker --skip-checks --bundles deb
          BUNDLE="$CARGO_TARGET_DIR/release/bundle/deb"
          mapfile -t PACKAGES < <(find "$BUNDLE" -maxdepth 1 -type f -name '*.deb')
          test "${#PACKAGES[@]}" = 1
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          NAME="LocalSR-v${VERSION}-Linux-CPU-amd64.deb"
          ARTIFACT="/mnt/lsr/out/$NAME"
          # Tauri writes the app version as is; to apt "0.6.0-beta" is upstream 0.6.0 with
          # Debian revision "beta", which sorts above the stable 0.6.0. "0.6.0~beta" sorts
          # below it, so the step from beta to stable is an upgrade.
          REPACK=/mnt/lsr/deb-repack
          rm -rf "$REPACK"
          dpkg-deb -R "${PACKAGES[0]}" "$REPACK"
          sed -i -E 's/^Version: ([0-9.]+)-(.+)$/Version: \1~\2/' "$REPACK/DEBIAN/control"
          # Tauri derives "local-sr" from the product name; the package is "localsr".
          sed -i -E 's/^Package: .*/Package: localsr/' "$REPACK/DEBIAN/control"
          dpkg-deb --root-owner-group -b "$REPACK" "$ARTIFACT"
          rm -rf "$REPACK" "${PACKAGES[0]}"
          dpkg-deb --info "$ARTIFACT"
          test "$(dpkg-deb -f "$ARTIFACT" Version)" = "$(printf '%s' "$VERSION" | sed 's/-/~/')"
          test "$(dpkg-deb -f "$ARTIFACT" Package)" = localsr
          test "$(dpkg-deb -f "$ARTIFACT" Architecture)" = amd64
          EXTRACT=/mnt/lsr/deb-extract
          rm -rf "$EXTRACT" /mnt/lsr/deb-source
          dpkg-deb -x "$ARTIFACT" "$EXTRACT"
          # The AppImage's checks, on what the .deb installs.
          python scripts/verify_codec_allowlist.py --tree "$EXTRACT" --output "/mnt/lsr/out/$NAME.codec-policy.json"
          python scripts/verify_nvidia_redistributables.py "$EXTRACT" | tee "/mnt/lsr/out/$NAME.nvidia.json"
          python scripts/verify_appimage_libc.py "$EXTRACT" --report "/mnt/lsr/out/$NAME.libc.json"
          # Every system library it links comes with its Depends. Before the install, so
          # dpkg -S (here and in the source bundle) finds only the system's own copies.
          python scripts/verify_deb_dependencies.py "$EXTRACT" --package "$ARTIFACT" \
            --report "/mnt/lsr/out/$NAME.dependencies.json"
          mapfile -t EXTRA < <(python scripts/fetch_extra_sources.py --platform linux-x86_64 \
            --destination /mnt/lsr/extra-sources)
          SOURCE_NAME="LocalSR-v${VERSION}-Linux-CPU-deb-source-and-notices.tar.gz"
          python scripts/build_source_bundle.py --inventory "$EXTRACT" \
            --output /mnt/lsr/deb-source --commit "$GITHUB_SHA" \
            --media-source /mnt/lsr/lgpl-media/linux-x86_64/dist/corresponding-source \
            --opencv-source /mnt/lsr/lgpl-media/linux-x86_64/opencv/corresponding-source \
            "${EXTRA[@]}" --apt-sources > "/mnt/lsr/out/$SOURCE_NAME.json"
          tar -C /mnt/lsr -czf "/mnt/lsr/out/$SOURCE_NAME" deb-source
          rm -rf "$EXTRACT" /mnt/lsr/deb-source
          # sudo apt-get install ./file.deb, start the installed host, sudo apt-get remove,
          # and every file it installed must be gone.
          python scripts/smoke_tauri_installer.py --backend CPU --timeout 900 \
            --artifact-glob "$ARTIFACT" --report "/mnt/lsr/out/$NAME.smoke.json" \
            --update-target linux-x86_64-cpu-deb --commit "$GITHUB_SHA"
          (cd /mnt/lsr/out && sha256sum "$NAME" > "$NAME.sha256")
          ls -la /mnt/lsr/out
          df -h / /mnt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.id }}
          path: /mnt/lsr/out/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  attach:
    name: Attach verified AppImages and the .deb to the release
    needs: appimage
    if: ${{ !cancelled() && inputs.release_tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: assets
          merge-multiple: true
      - name: Upload the AppImages, the .deb and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          shopt -s nullglob
          files=(assets/*.AppImage assets/*.AppImage.part-* assets/*.AppImage.sha256 \
            assets/*.deb assets/*.deb.sha256 \
            assets/*.engine.tar.gz.part-* assets/*.engine-payload.json \
            assets/*-source-and-notices.tar.gz)
          test "${#files[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
