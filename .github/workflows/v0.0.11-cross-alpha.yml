name: v0.0.11 Mac mini Cross Alpha

on:
  push:
    tags:
      - "v0.0.11-alpha"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: localsr-macmini-heavy
  cancel-in-progress: false

env:
  CI_ARTIFACT_SERVER: "http://192.168.9.134:8000"
  PIP_VERSION: "26.2.1"
  PYTORCH_VERSION: "2.13.0"
  TORCHVISION_VERSION: "0.28.0"
  PYINSTALLER_VERSION: "6.22.2"

jobs:
  coordinate-heavy-work:
    name: Require an idle Mac mini
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fail before occupying a guest if validation is active
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/workflow_coordination.py \
            --repository "$GITHUB_REPOSITORY" \
            --current-run-id "$GITHUB_RUN_ID" \
            --mode fail \
            --blocked-workflow "CI" \
            --blocked-workflow "Tauri Next Preview"

  preflight:
    name: Preflight ${{ matrix.platform }} release runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: '["self-hosted","Linux","X64","localsr-linux-builder"]'
          - platform: windows
            runner: '["self-hosted","Windows","X64","localsr-windows-builder"]'
          - platform: macos
            runner: '["self-hosted","macOS","X64","localsr-macos-cross-builder"]'
    needs: [coordinate-heavy-work]
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify Linux receiver, storage, and tools
        if: runner.os == 'Linux'
        run: |
          python3 scripts/release_runner_preflight.py \
            --server "$CI_ARTIFACT_SERVER" --platform linux --scratch-path /ci-scratch \
            --scratch-min-free-gib 15 --require-tool python3 --require-tool curl --require-tool git
      - name: Verify Windows receiver, storage, VC runtime, and tools
        if: runner.os == 'Windows'
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          ./scripts/ensure_windows_vc_runtime.ps1
          ./scripts/ensure_windows_scratch.ps1 -MinimumFreeGiB 20
          py -3.11 scripts/release_runner_preflight.py --server $env:CI_ARTIFACT_SERVER --platform windows --scratch-path C:\ --scratch-min-free-gib 20 --require-tool py --require-tool git
      - name: Verify macOS receiver, storage, and tools
        if: runner.os == 'macOS'
        run: |
          python3 scripts/release_runner_preflight.py \
            --server "$CI_ARTIFACT_SERVER" --platform macos --scratch-path /Volumes/CISCRATCH \
            --scratch-min-free-gib 6 --require-tool python3 --require-tool curl \
            --require-tool git --require-tool lipo --require-tool codesign --require-tool hdiutil

  build-linux:
    name: Build Linux x86_64 alpha on Mac mini
    needs: [preflight]
    runs-on: [self-hosted, Linux, X64, localsr-linux-builder]
    timeout-minutes: 240
    env:
      PIP_CACHE_DIR: /ci-scratch/cache/pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Revalidate release runner immediately before build
        run: |
          python3 scripts/release_runner_preflight.py \
            --server "$CI_ARTIFACT_SERVER" --platform linux \
            --scratch-path /ci-scratch --scratch-min-free-gib 15 \
            --require-tool python3 --require-tool curl --require-tool git
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Expose the persistent Rust toolchain
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Allocate bounded SSD working storage
        run: |
          python3 scripts/release_scratch.py init --root /ci-scratch
          python3 scripts/release_scratch.py cleanup --root /ci-scratch
          ROOT=$(python3 scripts/release_scratch.py start --root /ci-scratch \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --platform linux --flavor v0.0.11-alpha)
          mkdir -p /ci-scratch/cache/pip
          python3 scripts/storage_preflight.py --ssd-path / --skip-hdd --ssd-peak-gib 8
          "$HOME/.venv-ci/bin/python3.11" -m venv "$ROOT/venv"
          {
            echo "LOCALSR_ALPHA_ROOT=$ROOT"
            echo "TMPDIR=$ROOT/tmp"
            echo "CARGO_TARGET_DIR=$ROOT/cargo-target"
          } >> "$GITHUB_ENV"
          echo "$ROOT/venv/bin" >> "$GITHUB_PATH"
      - name: Validate the exact alpha identity
        run: |
          TAG_ARGUMENTS=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG_ARGUMENTS=(--tag "$GITHUB_REF_NAME"); fi
          python scripts/check_release_version.py "${TAG_ARGUMENTS[@]}"
          python scripts/check_desktop_architecture.py
          python scripts/export_desktop_catalog.py --check
      - name: Install maintained Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils xvfb dbus-x11
          python -m pip install --disable-pip-version-check "pip==${PIP_VERSION}"
          python -m pip install --disable-pip-version-check \
            "torch==${PYTORCH_VERSION}" "torchvision==${TORCHVISION_VERSION}" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            -e ".[package,video,face]" "pyinstaller==${PYINSTALLER_VERSION}"
          python -m pip check
          python -c "import diffusers,torch; from packaging.version import Version; assert Version(diffusers.__version__) >= Version('0.38.0'); assert torch.__version__.startswith('2.13.')"
          npm ci --prefix desktop
      - name: Download and run actual Quick and Best from an empty cache
        run: |
          LIVE_MODEL_CACHE="$LOCALSR_ALPHA_ROOT/live-model-cache"
          mkdir -p "$LIVE_MODEL_CACHE"
          test -z "$(find "$LIVE_MODEL_CACHE" -mindepth 1 -maxdepth 1 -print -quit)"
          python scripts/validate_live_models.py \
            --cache "$LIVE_MODEL_CACHE" \
            --report "$LOCALSR_ALPHA_ROOT/staging/live-models.json"
      - name: Build and smoke-test the AppImage
        run: |
          python scripts/build_tauri_preview.py --skip-checks --bundles appimage
          SOURCE=$(find "$CARGO_TARGET_DIR/release/bundle/appimage" -maxdepth 1 -type f -name '*.AppImage')
          test "$(printf '%s\n' "$SOURCE" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          ARTIFACT="$LOCALSR_ALPHA_ROOT/staging/LocalSR-v0.0.11-alpha-Linux-x86_64.AppImage"
          cp "$SOURCE" "$ARTIFACT"
          chmod +x "$ARTIFACT"
          python scripts/smoke_tauri_installer.py \
            --artifact-glob "$ARTIFACT" \
            --report "$LOCALSR_ALPHA_ROOT/staging/package-smoke.json"
          python scripts/verify_tauri_release_package.py "$ARTIFACT" \
            --platform linux --architecture x86_64 \
            --report "$ARTIFACT.architecture.json"
          python -c 'import json,sys; open(sys.argv[1],"w").write(json.dumps({"status":"sha256"},indent=2)+"\n")' \
            "$LOCALSR_ALPHA_ROOT/staging/signing-report.json"
          python scripts/write_artifact_metadata.py "$ARTIFACT" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --platform linux --architecture x86_64 --backend CPU \
            --smoke-report "$LOCALSR_ALPHA_ROOT/staging/package-smoke.json" \
            --signing-report "$LOCALSR_ALPHA_ROOT/staging/signing-report.json" \
            --live-model-report "$LOCALSR_ALPHA_ROOT/staging/live-models.json"
      - name: Transfer verified Linux alpha inputs
        env:
          CI_ARTIFACT_TOKEN: ${{ secrets.CI_ARTIFACT_TOKEN }}
        run: |
          ARTIFACT="$LOCALSR_ALPHA_ROOT/staging/LocalSR-v0.0.11-alpha-Linux-x86_64.AppImage"
          python scripts/upload_artifacts.py --server "$CI_ARTIFACT_SERVER" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --platform linux \
            "$ARTIFACT" "$ARTIFACT.sha256" "$ARTIFACT.metadata.json" "$ARTIFACT.architecture.json"
      - name: Finalize bounded Linux scratch
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -n "${LOCALSR_ALPHA_ROOT:-}" && -f "$LOCALSR_ALPHA_ROOT/.localsr-release-run.json" ]]; then
            python3 scripts/release_scratch.py finish --root /ci-scratch \
              --target "$LOCALSR_ALPHA_ROOT" --status "$JOB_STATUS" --retain-hours 48
          fi

  build-windows:
    name: Build unsigned Windows x86_64 alpha on Mac mini
    needs: [build-linux]
    runs-on: [self-hosted, Windows, X64, localsr-windows-builder]
    timeout-minutes: 240
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Revalidate release runner immediately before build
        run: |
          ./scripts/ensure_windows_vc_runtime.ps1
          ./scripts/ensure_windows_scratch.ps1 -MinimumFreeGiB 20
          py -3.11 scripts/release_runner_preflight.py --server $env:CI_ARTIFACT_SERVER --platform windows --scratch-path C:\ --scratch-min-free-gib 20 --require-tool py --require-tool git
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install stable Rust and initialize MSVC
        run: ./scripts/install_windows_rust.ps1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Allocate bounded Windows working storage
        run: |
          py -3.11 scripts/release_scratch.py init --root C:\lsr-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3.11 scripts/release_scratch.py cleanup --root C:\lsr-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = "C:\lsr-ci\runs\$env:GITHUB_RUN_ID\$env:GITHUB_RUN_ATTEMPT\windows\v0.0.11-alpha"
          py -3.11 scripts/release_scratch.py start --root C:\lsr-ci --run-id $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT --platform windows --flavor v0.0.11-alpha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $venv = Join-Path $root "venv"
          $tmp = Join-Path $root "tmp"
          New-Item -ItemType Directory -Force -Path $tmp, (Join-Path $root "staging") | Out-Null
          py -3.11 -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LOCALSR_ALPHA_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$tmp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$tmp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$(Join-Path $root 'cargo-target')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $venv "Scripts") | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install maintained Windows packaging dependencies
        run: |
          python -m pip install --disable-pip-version-check "pip==$env:PIP_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check "torch==$env:PYTORCH_VERSION" "torchvision==$env:TORCHVISION_VERSION" --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check -e ".[package,video,face]" "pyinstaller==$env:PYINSTALLER_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import diffusers,torch; from packaging.version import Version; assert Version(diffusers.__version__) >= Version('0.38.0'); assert torch.__version__.startswith('2.13.')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and smoke-test the unsigned NSIS alpha
        run: |
          python scripts/build_tauri_preview.py --skip-checks --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sources = @(Get-ChildItem -Path (Join-Path $env:CARGO_TARGET_DIR 'release\bundle\nsis') -Filter '*.exe' -File)
          if ($sources.Count -ne 1) { throw "Expected one NSIS installer, found $($sources.Count)" }
          $artifact = Join-Path $env:LOCALSR_ALPHA_ROOT 'staging\LocalSR-v0.0.11-alpha-Windows-x86_64.exe'
          Copy-Item -LiteralPath $sources[0].FullName -Destination $artifact
          python scripts/smoke_tauri_installer.py --artifact-glob $artifact --report (Join-Path $env:LOCALSR_ALPHA_ROOT 'staging\package-smoke.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_tauri_release_package.py $artifact --platform windows --architecture x86_64 --smoke-report (Join-Path $env:LOCALSR_ALPHA_ROOT 'staging\package-smoke.json') --report "$artifact.architecture.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/write_alpha_signing_report.py --platform windows --output (Join-Path $env:LOCALSR_ALPHA_ROOT 'staging\signing-report.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/write_artifact_metadata.py $artifact --commit $env:GITHUB_SHA --run-id $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT --platform windows --architecture x86_64 --backend CPU --smoke-report (Join-Path $env:LOCALSR_ALPHA_ROOT 'staging\package-smoke.json') --signing-report (Join-Path $env:LOCALSR_ALPHA_ROOT 'staging\signing-report.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Transfer verified Windows alpha inputs
        env:
          CI_ARTIFACT_TOKEN: ${{ secrets.CI_ARTIFACT_TOKEN }}
        run: |
          $artifact = Join-Path $env:LOCALSR_ALPHA_ROOT 'staging\LocalSR-v0.0.11-alpha-Windows-x86_64.exe'
          python scripts/upload_artifacts.py --server $env:CI_ARTIFACT_SERVER --run-id $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT --platform windows $artifact "$artifact.sha256" "$artifact.metadata.json" "$artifact.architecture.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Finalize bounded Windows scratch
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if ($env:LOCALSR_ALPHA_ROOT -and (Test-Path -LiteralPath (Join-Path $env:LOCALSR_ALPHA_ROOT '.localsr-release-run.json'))) {
            py -3.11 scripts/release_scratch.py finish --root C:\lsr-ci --target $env:LOCALSR_ALPHA_ROOT --status $env:JOB_STATUS --retain-hours 48
          }

  build-macos-cross:
    name: Cross-build ad-hoc macOS ARM64 alpha on Mac mini
    needs: [build-windows]
    runs-on: [self-hosted, macOS, X64, localsr-macos-cross-builder]
    timeout-minutes: 360
    env:
      CI_SCRATCH: /Volumes/CISCRATCH
      PIP_CACHE_DIR: /Volumes/CISCRATCH/cache/pip
      PYINSTALLER_CONFIG_DIR: /Volumes/CISCRATCH/cache/pyinstaller
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Revalidate release runner immediately before build
        run: |
          python3 scripts/release_runner_preflight.py \
            --server "$CI_ARTIFACT_SERVER" --platform macos \
            --scratch-path "$CI_SCRATCH" --scratch-min-free-gib 6 \
            --require-tool python3 --require-tool curl --require-tool git \
            --require-tool lipo --require-tool codesign --require-tool hdiutil
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Expose the persistent Rust toolchain
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy,rustfmt
          targets: aarch64-apple-darwin
      - name: Allocate bounded guest SSD working storage
        id: scratch
        run: |
          python3 scripts/release_scratch.py init --root "$CI_SCRATCH"
          python3 scripts/release_scratch.py cleanup --root "$CI_SCRATCH"
          python3 scripts/storage_preflight.py \
            --ssd-path "$CI_SCRATCH" --skip-hdd --ssd-min-percent 20 --ssd-min-gib 6 --ssd-peak-gib 15
          RUN_ROOT=$(python3 scripts/release_scratch.py start \
            --root "$CI_SCRATCH" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --platform macos --flavor tauri-v0.0.11-cross-alpha)
          echo "run_root=$RUN_ROOT" >> "$GITHUB_OUTPUT"
      - name: Copy the working set to the guest SSD
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          mkdir -p "$RUN_ROOT/source"
          rsync -a --exclude '/.git/' "$GITHUB_WORKSPACE/" "$RUN_ROOT/source/"
      - name: Create the universal2 analysis environment
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          export TMPDIR="$RUN_ROOT/tmp"
          UNIVERSAL_PYTHON=/Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11
          test -x "$UNIVERSAL_PYTHON"
          lipo -archs "$UNIVERSAL_PYTHON" | grep -q x86_64
          lipo -archs "$UNIVERSAL_PYTHON" | grep -q arm64
          "$UNIVERSAL_PYTHON" -m venv "$RUN_ROOT/environment/venv"
          PYTHON="$RUN_ROOT/environment/venv/bin/python"
          "$PYTHON" -m pip install --upgrade "pip==$PIP_VERSION"
          "$PYTHON" -m pip install -r "$RUN_ROOT/source/requirements/macos-cross-tools.txt"
          BOOTSTRAP_WHEELS="$RUN_ROOT/wheels/bootstrap"
          mkdir -p "$BOOTSTRAP_WHEELS"
          "$PYTHON" -m pip wheel --disable-pip-version-check --no-deps \
            --wheel-dir "$BOOTSTRAP_WHEELS" "antlr4-python3-runtime==4.9.3"
          export PIP_FIND_LINKS="$BOOTSTRAP_WHEELS"
          "$PYTHON" "$RUN_ROOT/source/scripts/macos_cross_wheels.py" prepare \
            --requirements "$RUN_ROOT/source/requirements/macos-cross-v0.0.11-alpha.txt" \
            --output "$RUN_ROOT/wheels"
          "$PYTHON" -m pip install --no-index --find-links "$RUN_ROOT/wheels/wheelhouse" \
            -r "$RUN_ROOT/source/requirements/macos-cross-v0.0.11-alpha.txt"
          "$PYTHON" -m pip install --no-deps -e "$RUN_ROOT/source"
          "$PYTHON" -m pip check
          SITE_PACKAGES=$("$PYTHON" -c 'import site; print(site.getsitepackages()[0])')
          "$PYTHON" "$RUN_ROOT/source/scripts/macos_cross_wheels.py" normalize-openmp \
            --site-packages "$SITE_PACKAGES" \
            --report "$RUN_ROOT/staging/openmp-normalization.json"
          "$PYTHON" "$RUN_ROOT/source/scripts/verify_macho_tree.py" "$SITE_PACKAGES" \
            --require x86_64,arm64 --exclude 'delocate/tests/data/*' \
            --report "$RUN_ROOT/staging/universal2-environment.json"
          npm ci --prefix "$RUN_ROOT/source/desktop"
      - name: Cross-build and statically verify the ARM64 DMG
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          export TMPDIR="$RUN_ROOT/tmp"
          export CARGO_TARGET_DIR="$RUN_ROOT/cargo-target"
          PYTHON="$RUN_ROOT/environment/venv/bin/python"
          cd "$RUN_ROOT/source"
          "$PYTHON" scripts/build_tauri_preview.py \
            --skip-checks --target aarch64-apple-darwin --bundles dmg
          SOURCE=$(find "$CARGO_TARGET_DIR" -path '*/release/bundle/dmg/*.dmg' -type f)
          test "$(printf '%s\n' "$SOURCE" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          ARTIFACT="$RUN_ROOT/staging/LocalSR-v0.0.11-alpha-macOS-arm64.dmg"
          cp "$SOURCE" "$ARTIFACT"
          "$PYTHON" scripts/verify_tauri_release_package.py "$ARTIFACT" \
            --platform macos --architecture arm64 --report "$ARTIFACT.architecture.json"
          "$PYTHON" -c 'import json,sys; open(sys.argv[1],"w").write(json.dumps({"passed":False,"mode":"cross-build-static","version":"0.0.11-alpha","architecture":"arm64","static_verified":True,"runtime_tested":False,"reason":"Intel Mac mini cannot execute ARM64 and no accessible physical Apple-Silicon runner is registered; static package evidence only."},indent=2)+"\n")' \
            "$RUN_ROOT/staging/package-smoke.json"
          "$PYTHON" scripts/write_alpha_signing_report.py \
            --platform macos --output "$RUN_ROOT/staging/signing-report.json"
          "$PYTHON" scripts/write_artifact_metadata.py "$ARTIFACT" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --platform macos --architecture arm64 --backend MPS \
            --smoke-report "$RUN_ROOT/staging/package-smoke.json" \
            --signing-report "$RUN_ROOT/staging/signing-report.json" \
            --wheel-manifest "$RUN_ROOT/wheels/wheel-manifest.json" \
            --normalization-report "$RUN_ROOT/staging/openmp-normalization.json"
      - name: Transfer verified macOS alpha inputs
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
          CI_ARTIFACT_TOKEN: ${{ secrets.CI_ARTIFACT_TOKEN }}
        run: |
          ARTIFACT="$RUN_ROOT/staging/LocalSR-v0.0.11-alpha-macOS-arm64.dmg"
          "$RUN_ROOT/environment/venv/bin/python" "$RUN_ROOT/source/scripts/upload_artifacts.py" \
            --server "$CI_ARTIFACT_SERVER" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --platform macos \
            "$ARTIFACT" "$ARTIFACT.sha256" "$ARTIFACT.metadata.json" "$ARTIFACT.architecture.json"
      - name: Finalize bounded macOS scratch
        if: always()
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -n "${RUN_ROOT:-}" && -f "$RUN_ROOT/.localsr-release-run.json" ]]; then
            python3 scripts/release_scratch.py finish --root "$CI_SCRATCH" \
              --target "$RUN_ROOT" --status "$JOB_STATUS" --retain-hours 48
          fi

  verify-release-matrix:
    name: Verify complete v0.0.11 release matrix
    needs: [build-macos-cross]
    runs-on: [self-hosted, Linux, X64, localsr-linux-builder]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select attempts and verify exactly five releasable files
        run: |
          RUN_ROOT="/mnt/hdd/ci-artifacts/$GITHUB_RUN_ID"
          OUTPUT="$RUN_ROOT/$GITHUB_RUN_ATTEMPT/tauri-v0.0.11-rehearsal"
          TAG="${GITHUB_REF_NAME:-v0.0.11-alpha}"
          if [[ "$TAG" != v0.0.11-alpha ]]; then TAG=v0.0.11-alpha; fi
          "$HOME/.venv-ci/bin/python3.11" scripts/prepare_tauri_release_assets.py "$RUN_ROOT" \
            --manifest ci/tauri-cross-alpha-artifacts.json --readiness ci/beta-readiness.json \
            --tag "$TAG" --commit "$GITHUB_SHA" --output "$OUTPUT" --verification-only
          test "$(wc -l < "$OUTPUT/release-files.txt" | tr -d ' ')" = 5
          test "$(find "$OUTPUT" -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' \) | wc -l | tr -d ' ')" = 3
          "$HOME/.venv-ci/bin/python3.11" -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["verification_only"] is True; assert d["repository_commit"]==sys.argv[2]; assert set(d["source_matrix"])=={"linux","windows","macos"}' "$OUTPUT/release-index.json" "$GITHUB_SHA"

  publish-release:
    name: Publish compact v0.0.11 prerelease
    if: github.ref == 'refs/tags/v0.0.11-alpha'
    needs: [verify-release-matrix]
    runs-on: [self-hosted, Linux, X64, localsr-linux-builder]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare exactly five user-facing assets
        run: |
          RUN_ROOT="/mnt/hdd/ci-artifacts/$GITHUB_RUN_ID"
          OUTPUT="$RUN_ROOT/$GITHUB_RUN_ATTEMPT/tauri-v0.0.11-release-assets"
          "$HOME/.venv-ci/bin/python3.11" scripts/prepare_tauri_release_assets.py "$RUN_ROOT" \
            --manifest ci/tauri-cross-alpha-artifacts.json --readiness ci/beta-readiness.json \
            --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --output "$OUTPUT"
          echo "LOCALSR_RELEASE_OUTPUT=$OUTPUT" >> "$GITHUB_ENV"
      - name: Create or resume, verify, and publish the immutable prerelease
        run: |
          TAG="$GITHUB_REF_NAME"
          TITLE="LocalSR $TAG"
          NOTES_FILE="docs/releases/$TAG.md"
          test -f "$NOTES_FILE"
          "$HOME/.venv-ci/bin/python3.11" scripts/publish_tauri_release.py \
            --tag "$TAG" --commit "$GITHUB_SHA" --title "$TITLE" \
            --notes "$NOTES_FILE" --output "$LOCALSR_RELEASE_OUTPUT"
