name: Linux Runner Maintenance

on:
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: [self-hosted, Linux, X64, localsr-linux-builder]
    steps:
      - name: Inspect AppDir libtorch_python
        run: |
          ls -la "/tmp/squashfs-root/usr/lib/LocalSR Next Preview/engine/_internal/torch/" || true
          ls -la "/tmp/squashfs-root/usr/lib/LocalSR Next Preview/engine/_internal/torch/lib/" || true
          ls -la "/tmp/squashfs-root/usr/lib/libtorch_python"* || true
          find /tmp/squashfs-root -name "*libtorch_python*" -exec ls -la {} +
