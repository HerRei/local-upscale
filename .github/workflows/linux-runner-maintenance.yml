name: Linux Runner Maintenance

on:
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: [self-hosted, Linux, X64, localsr-linux-builder]
    steps:
      - name: Install system runtime libraries and test torch import
        run: |
          # Remove broken dummy stubs
          sudo rm -f /usr/local/lib/libze_loader.so.1 /usr/local/lib/libucp.so.0 /usr/local/lib/libpsm2.so.2
          sudo apt-get update
          # Install real Level Zero loader and verbs
          sudo apt-get install -y --no-install-recommends libze1 librdmacm1 libibverbs1
          sudo ldconfig
          ldconfig -p | grep -E "libze|librdmacm|libibverbs"
          # Test if torch imports cleanly in CI venv if present
          if [ -f "$HOME/.venv-ci/bin/python3.11" ]; then
            "$HOME/.venv-ci/bin/python3.11" -c "import sys; print(sys.version)"
          fi
