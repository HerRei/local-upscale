name: Linux Runner Maintenance

on:
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: [self-hosted, Linux, X64, localsr-linux-builder]
    steps:
      - name: Debug backend-probe failure
        run: |
          WORKER=$(find /mnt/hdd/ci-scratch/r/34889339156/ -name "localsr-worker" | head -n 1)
          echo "Found worker: $WORKER"
          if [ -n "$WORKER" ]; then
            "$WORKER" --backend-probe Intel-XPU --output /tmp/debug.json
            cat /tmp/debug.json || true
          fi
