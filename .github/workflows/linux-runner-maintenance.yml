name: Linux Runner Maintenance

on:
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: [self-hosted, Linux, X64, localsr-linux-builder]
    steps:
      - name: Check /usr/local/lib and /usr/lib on runner
        run: |
          ls -la /usr/local/lib/*torch* 2>/dev/null || true
          ls -la /usr/lib/*torch* 2>/dev/null || true
          find /mnt/hdd/ci-scratch/cargo-target/tauri-x86_64/release/bundle/appimage/ -name "*libtorch*" -exec ls -la {} + 2>/dev/null || true
