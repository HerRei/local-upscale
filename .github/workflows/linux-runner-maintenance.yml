name: Linux Runner Maintenance

on:
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: [self-hosted, Linux, X64, localsr-linux-builder]
    steps:
      - name: Check df -h /tmp and /mnt/hdd
        run: |
          df -h /tmp /mnt/hdd /
          ls -la /tmp/squashfs-root 2>/dev/null | head -n 10 || true
