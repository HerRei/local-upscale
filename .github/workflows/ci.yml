name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: localsr-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  coordinate-heavy-work:
    name: Wait for release priority
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Wait without occupying a Mac-mini guest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/workflow_coordination.py \
            --repository "$GITHUB_REPOSITORY" \
            --current-run-id "$GITHUB_RUN_ID" \
            --blocked-workflow "v0.0.12 Mac mini Cross Alpha" \
            --blocked-workflow "v0.0.13 Mac mini Cross Alpha" \
            --blocked-workflow "Signed Tauri Alpha Release"
          python3 scripts/workflow_coordination.py \
            --repository "$GITHUB_REPOSITORY" \
            --current-run-id "$GITHUB_RUN_ID" \
            --blocked-workflow "CI" \
            --only-older-runs
          python3 scripts/workflow_coordination.py \
            --repository "$GITHUB_REPOSITORY" \
            --current-run-id "$GITHUB_RUN_ID" \
            --blocked-workflow "Tauri Next Preview" \
            --only-older-runs \
            --ignore-head-sha "${{ github.event.pull_request.head.sha || github.sha }}"

  lint:
    name: Lint & format (Linux X64)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [coordinate-heavy-work]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Allocate isolated SSD workspace
        id: scratch
        run: |
          python3 scripts/ci_scratch.py init --root /ci-scratch
          python3 scripts/ci_scratch.py cleanup --root /ci-scratch --cache-max-gib 2
          python3 scripts/storage_preflight.py --ssd-path / --skip-hdd --ssd-min-percent 15 --ssd-peak-gib 3
          python3 scripts/ci_scratch.py start \
            --root /ci-scratch \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --platform linux \
            --flavor lint \
            --github-output "$GITHUB_OUTPUT"
      - name: Lint from the isolated environment
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          rsync -a --exclude '/.git/' "$GITHUB_WORKSPACE/" "$RUN_ROOT/source/"
          export TMPDIR="$RUN_ROOT/tmp"
          export PIP_CACHE_DIR="/ci-scratch/cache/pip"
          "$HOME/.venv-ci/bin/python3.11" -m venv "$RUN_ROOT/environment/venv"
          "$RUN_ROOT/environment/venv/bin/python" -m pip install \
            --disable-pip-version-check --upgrade "pip==26.2.1"
          "$RUN_ROOT/environment/venv/bin/python" -m pip install --disable-pip-version-check ruff
          cd "$RUN_ROOT/source"
          ACTIONLINT_ARCHIVE="$RUN_ROOT/environment/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$ACTIONLINT_ARCHIVE" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $ACTIONLINT_ARCHIVE" | sha256sum --check
          tar -xzf "$ACTIONLINT_ARCHIVE" -C "$RUN_ROOT/environment" actionlint
          "$RUN_ROOT/environment/actionlint" -color \
            -config-file .github/actionlint.yaml \
            .github/workflows/*.yml
          "$RUN_ROOT/environment/venv/bin/python" scripts/check_beta_readiness.py
          "$RUN_ROOT/environment/venv/bin/python" -m ruff check src tests scripts
          "$RUN_ROOT/environment/venv/bin/python" -m ruff format --check src tests scripts
      - name: Remove successful scratch
        if: success()
        run: |
          python3 scripts/ci_scratch.py finish \
            --root /ci-scratch \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --platform linux \
            --flavor lint \
            --status complete \
            --cleanup
      - name: Mark failed scratch for bounded retention
        if: failure() || cancelled()
        run: |
          ROOT="/ci-scratch/runs/${{ github.run_id }}/${{ github.run_attempt }}/linux/lint"
          if [ -f "$ROOT/.active" ]; then
            python3 scripts/ci_scratch.py finish \
              --root /ci-scratch \
              --run-id "${{ github.run_id }}" \
              --attempt "${{ github.run_attempt }}" \
              --platform linux \
              --flavor lint \
              --status failed
          fi

  test-linux:
    name: Test Linux X64
    needs: [lint]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Allocate isolated SSD workspace
        id: scratch
        run: |
          python3 scripts/storage_preflight.py --ssd-path / --skip-hdd --ssd-min-percent 15 --ssd-peak-gib 5
          python3 scripts/ci_scratch.py start \
            --root /ci-scratch \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --platform linux \
            --flavor tests \
            --github-output "$GITHUB_OUTPUT"
      - name: Install and test in isolation
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          rsync -a --exclude '/.git/' "$GITHUB_WORKSPACE/" "$RUN_ROOT/source/"
          export TMPDIR="$RUN_ROOT/tmp"
          export PIP_CACHE_DIR="/ci-scratch/cache/pip"
          "$HOME/.venv-ci/bin/python3.11" -m venv "$RUN_ROOT/environment/venv"
          PYTHON="$RUN_ROOT/environment/venv/bin/python"
          "$PYTHON" -m pip install --disable-pip-version-check --upgrade "pip==26.2.1"
          "$PYTHON" -m pip install --disable-pip-version-check \
            "torch==2.13.0" \
            "torchvision==0.28.0" \
            --index-url https://download.pytorch.org/whl/cpu
          "$PYTHON" -m pip install --disable-pip-version-check -e "$RUN_ROOT/source[dev,video,face]"
          "$PYTHON" -m pip install --disable-pip-version-check build
          cd "$RUN_ROOT/source"
          "$PYTHON" -m pyright --pythonpath "$PYTHON"
          "$PYTHON" -m pytest tests/ -v
          "$PYTHON" -m build
          "$PYTHON" scripts/verify_python_package_data.py dist/*.whl dist/*.tar.gz
      - name: Finalize scratch state
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          if [ -n "$RUN_ROOT" ] && [ -f "$RUN_ROOT/.active" ]; then
            if [ "$JOB_STATUS" = success ]; then
              STATUS=complete
              CLEANUP=--cleanup
            else
              STATUS=failed
              CLEANUP=
            fi
            python3 scripts/ci_scratch.py finish \
              --root /ci-scratch \
              --run-id "${{ github.run_id }}" \
              --attempt "${{ github.run_attempt }}" \
              --platform linux \
              --flavor tests \
              --status "$STATUS" $CLEANUP
          fi

  test-windows:
    name: Test Windows X64
    needs: [test-linux]
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Ensure signed Microsoft VC++ runtime
        run: ./scripts/ensure_windows_vc_runtime.ps1
      - name: Ensure bounded Windows scratch capacity
        run: ./scripts/ensure_windows_scratch.ps1 -MinimumFreeGiB 20
      - name: Test in an isolated runner-temp environment
        run: |
          $root = Join-Path $env:RUNNER_TEMP "LocalSR-CI\${{ github.run_id }}\${{ github.run_attempt }}\tests"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\tmp" | Out-Null
          $env:TEMP = "$root\tmp"
          $env:TMP = "$root\tmp"
          Copy-Item -LiteralPath $env:GITHUB_WORKSPACE -Destination "$root\source" -Recurse -Force
          py -3.11 -m venv "$root\venv"
          $python = "$root\venv\Scripts\python.exe"
          & $python -m pip install --disable-pip-version-check --upgrade "pip==26.2.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --disable-pip-version-check --no-cache-dir `
            "torch==2.13.0" `
            "torchvision==0.28.0" `
            --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --disable-pip-version-check --no-cache-dir -e "$root\source[dev,video,face]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -c "import torch, torchvision; print(f'torch={torch.__version__} torchvision={torchvision.__version__}')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location "$root\source"
          & $python -m pytest tests/ -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove only this run workspace
        if: always()
        run: ./scripts/remove_windows_scratch.ps1 -ManagedRoot (Join-Path $env:RUNNER_TEMP "LocalSR-CI") -Target (Join-Path $env:RUNNER_TEMP "LocalSR-CI\${{ github.run_id }}\${{ github.run_attempt }}\tests")

  test-macos:
    name: Test macOS X64 on SSD
    needs: [test-windows]
    runs-on: [self-hosted, macOS, X64]
    env:
      CI_SCRATCH: /Volumes/CISCRATCH
      PIP_CACHE_DIR: /Volumes/CISCRATCH/cache/pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Allocate isolated guest SSD workspace
        id: scratch
        run: |
          python3 scripts/ci_scratch.py init --root "$CI_SCRATCH"
          python3 scripts/ci_scratch.py cleanup --root "$CI_SCRATCH" --cache-max-gib 2
          python3 scripts/storage_preflight.py \
            --ssd-path "$CI_SCRATCH" \
            --skip-hdd \
            --ssd-min-percent 20 \
            --ssd-min-gib 6 \
            --ssd-min-percent 15 --ssd-peak-gib 5
          python3 scripts/ci_scratch.py start \
            --root "$CI_SCRATCH" \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --platform macos \
            --flavor tests \
            --github-output "$GITHUB_OUTPUT"
      - name: Install and test entirely on the guest SSD
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          rsync -a --exclude '/.git/' "$GITHUB_WORKSPACE/" "$RUN_ROOT/source/"
          /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 \
            -m venv "$RUN_ROOT/environment/venv"
          PYTHON="$RUN_ROOT/environment/venv/bin/python"
          "$PYTHON" -m pip install --disable-pip-version-check --upgrade "pip==26.2.1"
          "$PYTHON" -m pip install --disable-pip-version-check -e "$RUN_ROOT/source[dev,video,face]"
          cd "$RUN_ROOT/source"
          "$PYTHON" -m pytest tests/ -v
      - name: Finalize guest scratch state
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          if [ -n "$RUN_ROOT" ] && [ -f "$RUN_ROOT/.active" ]; then
            if [ "$JOB_STATUS" = success ]; then
              STATUS=complete
              CLEANUP=--cleanup
            else
              STATUS=failed
              CLEANUP=
            fi
            python3 scripts/ci_scratch.py finish \
              --root "$CI_SCRATCH" \
              --run-id "${{ github.run_id }}" \
              --attempt "${{ github.run_attempt }}" \
              --platform macos \
              --flavor tests \
              --status "$STATUS" $CLEANUP
          fi
