name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff Lint
        run: ruff check src tests
      - name: Run Ruff Format Check
        run: ruff format --check src tests

  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y libgl1 libglib2.0-0 libdbus-1-3

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov

      - name: Install macOS Specific Dependencies
        if: runner.os == 'macOS'
        run: |
          python -m pip install pyobjc-framework-Cocoa

      - name: Run Platform & Integration Test Suite
        run: |
          python -m pytest tests/test_platform_integration.py -v

      - name: Run Full Test Suite
        run: |
          python -m pytest tests/ -v
