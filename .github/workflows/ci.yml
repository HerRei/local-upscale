name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PIP_BREAK_SYSTEM_PACKAGES: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ruff
        run: python3 -m pip install ruff
      - name: Run Ruff Lint
        run: python3 -m ruff check src tests
      - name: Run Ruff Format Check
        run: python3 -m ruff format --check src tests

  test-linux:
    name: Test on Linux x86_64 (Mac Mini)
    needs: lint
    runs-on: [self-hosted, Linux]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo -n apt-get update -qq 2>/dev/null || true
          sudo -n apt-get install -qq -y libgl1 libglib2.0-0 libdbus-1-3 2>/dev/null || true

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev,video]"
          python3 -m pip install pytest pytest-cov

      - name: Run Platform & Integration Test Suite
        run: |
          python3 -m pytest tests/test_platform_integration.py -v

      - name: Run Full Test Suite
        run: |
          python3 -m pytest tests/ -v

      - name: Clean Test Cache and Temporary Files
        if: always()
        run: |
          rm -rf build/ dist/ *.egg-info .pytest_cache/ /tmp/pytest*

  test-macos:
    name: Test on macOS x86_64 (Mac Mini VM)
    needs: lint
    runs-on: [self-hosted, macOS]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: |
          python3.11 -m pip install --upgrade pip
          python3.11 -m pip install -e ".[dev,video]"
          python3.11 -m pip install pyobjc-framework-Cocoa pytest pytest-cov

      - name: Run Platform & Integration Test Suite
        run: |
          python3.11 -m pytest tests/test_platform_integration.py -v

      - name: Run Full Test Suite
        run: |
          python3.11 -m pytest tests/ -v

      - name: Clean Test Cache and Temporary Files
        if: always()
        run: |
          rm -rf build/ dist/ *.egg-info .pytest_cache/ /tmp/pytest*

  test-windows:
    name: Test on Windows x86_64 (Mac Mini VM)
    needs: lint
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,video]"
          python -m pip install pytest pytest-cov

      - name: Run Full Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Clean Test Cache and Temporary Files
        if: always()
        run: |
          Remove-Item -Path build, dist, *.egg-info, .pytest_cache -Recurse -Force -ErrorAction SilentlyContinue
