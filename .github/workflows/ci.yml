name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localsr-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_BREAK_SYSTEM_PACKAGES: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  lint:
    name: Lint & format (Linux X64)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Allocate isolated SSD workspace
        id: scratch
        run: |
          python3 scripts/ci_scratch.py init --root /ci-scratch
          python3 scripts/ci_scratch.py cleanup --root /ci-scratch
          python3 scripts/storage_preflight.py --ssd-path / --skip-hdd --ssd-peak-gib 3
          python3 scripts/ci_scratch.py start \
            --root /ci-scratch \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --platform linux \
            --flavor lint \
            --github-output "$GITHUB_OUTPUT"
      - name: Lint from the isolated environment
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          rsync -a --exclude .git "$GITHUB_WORKSPACE/" "$RUN_ROOT/source/"
          python3.11 -m venv "$RUN_ROOT/environment/venv"
          "$RUN_ROOT/environment/venv/bin/python" -m pip install --disable-pip-version-check ruff
          cd "$RUN_ROOT/source"
          "$RUN_ROOT/environment/venv/bin/python" -m ruff check src tests scripts
          "$RUN_ROOT/environment/venv/bin/python" -m ruff format --check src tests scripts
      - name: Remove successful scratch
        if: success()
        run: |
          python3 scripts/ci_scratch.py finish \
            --root /ci-scratch \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --platform linux \
            --flavor lint \
            --status complete \
            --cleanup
      - name: Mark failed scratch for bounded retention
        if: failure() || cancelled()
        run: |
          ROOT="/ci-scratch/runs/${{ github.run_id }}/${{ github.run_attempt }}/linux/lint"
          if [ -f "$ROOT/.active" ]; then
            python3 scripts/ci_scratch.py finish \
              --root /ci-scratch \
              --run-id "${{ github.run_id }}" \
              --attempt "${{ github.run_attempt }}" \
              --platform linux \
              --flavor lint \
              --status failed
          fi

  test-linux:
    name: Test Linux X64
    needs: [lint]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Allocate isolated SSD workspace
        id: scratch
        run: |
          python3 scripts/storage_preflight.py --ssd-path / --skip-hdd --ssd-peak-gib 8
          python3 scripts/ci_scratch.py start \
            --root /ci-scratch \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --platform linux \
            --flavor tests \
            --github-output "$GITHUB_OUTPUT"
      - name: Install and test in isolation
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          rsync -a --exclude .git "$GITHUB_WORKSPACE/" "$RUN_ROOT/source/"
          python3.11 -m venv "$RUN_ROOT/environment/venv"
          PYTHON="$RUN_ROOT/environment/venv/bin/python"
          "$PYTHON" -m pip install --disable-pip-version-check -e "$RUN_ROOT/source[dev,video]"
          cd "$RUN_ROOT/source"
          "$PYTHON" -m pytest tests/test_platform_integration.py -v
          "$PYTHON" -m pytest tests/ -v
      - name: Finalize scratch state
        if: always()
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          if [ -n "$RUN_ROOT" ] && [ -f "$RUN_ROOT/.active" ]; then
            if [ "${{ job.status }}" = success ]; then
              STATUS=complete
              CLEANUP=--cleanup
            else
              STATUS=failed
              CLEANUP=
            fi
            python3 scripts/ci_scratch.py finish \
              --root /ci-scratch \
              --run-id "${{ github.run_id }}" \
              --attempt "${{ github.run_attempt }}" \
              --platform linux \
              --flavor tests \
              --status "$STATUS" $CLEANUP
          fi

  test-windows:
    name: Test Windows X64
    needs: [test-linux]
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Test in an isolated runner-temp environment
        run: |
          $root = Join-Path $env:RUNNER_TEMP "LocalSR-CI\${{ github.run_id }}\${{ github.run_attempt }}\tests"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item -LiteralPath $env:GITHUB_WORKSPACE -Destination "$root\source" -Recurse -Force
          py -3.11 -m venv "$root\venv"
          $python = "$root\venv\Scripts\python.exe"
          & $python -m pip install --disable-pip-version-check -e "$root\source[dev,video]"
          Set-Location "$root\source"
          & $python -m pytest tests/ -v
      - name: Remove only this successful run workspace
        if: success()
        run: |
          $base = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP "LocalSR-CI")) + [IO.Path]::DirectorySeparatorChar
          $target = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP "LocalSR-CI\${{ github.run_id }}\${{ github.run_attempt }}\tests"))
          if (-not $target.StartsWith($base, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Unsafe cleanup target: $target"
          }
          Remove-Item -LiteralPath $target -Recurse -Force

  test-macos:
    name: Test macOS X64 on SSD
    needs: [test-windows]
    runs-on: [self-hosted, macOS, X64]
    env:
      CI_SCRATCH: /Volumes/CISCRATCH
      PIP_CACHE_DIR: /Volumes/CISCRATCH/cache/pip
    steps:
      - uses: actions/checkout@v4
      - name: Allocate isolated guest SSD workspace
        id: scratch
        run: |
          python3 scripts/ci_scratch.py init --root "$CI_SCRATCH"
          python3 scripts/ci_scratch.py cleanup --root "$CI_SCRATCH"
          python3 scripts/storage_preflight.py \
            --ssd-path "$CI_SCRATCH" \
            --skip-hdd \
            --ssd-min-percent 20 \
            --ssd-min-gib 6 \
            --ssd-peak-gib 8
          python3 scripts/ci_scratch.py start \
            --root "$CI_SCRATCH" \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --platform macos \
            --flavor tests \
            --github-output "$GITHUB_OUTPUT"
      - name: Install and test entirely on the guest SSD
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          rsync -a --exclude .git "$GITHUB_WORKSPACE/" "$RUN_ROOT/source/"
          /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 \
            -m venv "$RUN_ROOT/environment/venv"
          PYTHON="$RUN_ROOT/environment/venv/bin/python"
          "$PYTHON" -m pip install --disable-pip-version-check -e "$RUN_ROOT/source[dev,video]"
          cd "$RUN_ROOT/source"
          "$PYTHON" -m pytest tests/test_platform_integration.py -v
          "$PYTHON" -m pytest tests/ -v
      - name: Finalize guest scratch state
        if: always()
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          if [ -n "$RUN_ROOT" ] && [ -f "$RUN_ROOT/.active" ]; then
            if [ "${{ job.status }}" = success ]; then
              STATUS=complete
              CLEANUP=--cleanup
            else
              STATUS=failed
              CLEANUP=
            fi
            python3 scripts/ci_scratch.py finish \
              --root "$CI_SCRATCH" \
              --run-id "${{ github.run_id }}" \
              --attempt "${{ github.run_attempt }}" \
              --platform macos \
              --flavor tests \
              --status "$STATUS" $CLEANUP
          fi
