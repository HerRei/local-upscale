name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint tooling
        run: python -m pip install "ruff>=0.1.0"
      - name: Ruff lint
        run: ruff check src tests smoke_test_gui.py
      - name: Ruff formatting
        run: ruff format --check src tests smoke_test_gui.py

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1 libgl1
      - name: Install CPU PyTorch on Linux and Windows
        if: runner.os != 'macOS'
        shell: bash
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          torch torchvision
      - name: Install PyTorch on macOS
        if: runner.os == 'macOS'
        run: python -m pip install torch torchvision
      - name: Install LocalSR and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Build Python package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          retention-days: 14
