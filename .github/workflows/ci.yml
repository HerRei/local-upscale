name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ruff
        run: python3 -m pip install ruff
      - name: Run Ruff Lint
        run: python3 -m ruff check src tests
      - name: Run Ruff Format Check
        run: python3 -m ruff format --check src tests

  test:
    name: Test on ${{ matrix.os-name }}
    needs: lint
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: "Linux x86_64 (Mac Mini)"
            runs-on: [self-hosted, Linux]
          - os-name: "macOS ARM64 (MacBook)"
            runs-on: [self-hosted, macOS]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo -n apt-get update -qq 2>/dev/null || true
          sudo -n apt-get install -qq -y libgl1 libglib2.0-0 libdbus-1-3 2>/dev/null || true

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .
          python3 -m pip install pytest pytest-cov

      - name: Install macOS Specific Dependencies
        if: runner.os == 'macOS'
        run: |
          python3 -m pip install pyobjc-framework-Cocoa

      - name: Run Platform & Integration Test Suite
        run: |
          python3 -m pytest tests/test_platform_integration.py -v

      - name: Run Full Test Suite
        run: |
          python3 -m pytest tests/ -v
