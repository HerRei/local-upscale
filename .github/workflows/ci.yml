name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: localsr-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_BREAK_SYSTEM_PACKAGES: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  lint:
    name: Lint & format (Linux X64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Lint from the isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install \
            --disable-pip-version-check --upgrade "pip==26.2.1"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check "ruff==0.17.3" "vulture==2.16"
          ACTIONLINT_ARCHIVE="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$ACTIONLINT_ARCHIVE" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $ACTIONLINT_ARCHIVE" | sha256sum --check
          tar -xzf "$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color \
            -config-file .github/actionlint.yaml \
            .github/workflows/*.yml
          "$RUNNER_TEMP/venv/bin/python" scripts/check_beta_readiness.py
          "$RUNNER_TEMP/venv/bin/python" -m ruff check src tests scripts
          "$RUNNER_TEMP/venv/bin/python" -m ruff format --check src tests scripts
          "$RUNNER_TEMP/venv/bin/python" -m vulture src scripts packaging ci/vulture_whitelist.py \
            --exclude src/localsr/video_models/seedvr2/vendor

  test-linux:
    name: Test Linux X64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Match linux-appimages.yml's hosted-image cleanup. Reclaimed space and
      # Ubuntu package availability need confirmation in the first hosted run.
      - name: Free hosted Linux disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - name: Install Linux test prerequisites
        # Keep exercising the external-FFmpeg and legacy-video tests, as on the mini.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install and test in isolation
        # CPU wheels avoid CUDA's disk cost; resolution is verified by hosted CI.
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          PYTHON="$RUNNER_TEMP/venv/bin/python"
          "$PYTHON" -m pip install --disable-pip-version-check --upgrade "pip==26.2.1"
          "$PYTHON" -m pip install --disable-pip-version-check \
            "torch==2.13.0" \
            "torchvision==0.28.0" \
            --index-url https://download.pytorch.org/whl/cpu
          "$PYTHON" -m pip install --disable-pip-version-check -e ".[dev,video,face]"
          "$PYTHON" -m pip install --disable-pip-version-check build
          "$PYTHON" -m pyright --pythonpath "$PYTHON"
          "$PYTHON" -m pytest tests/ -v
          "$PYTHON" -m build
          "$PYTHON" scripts/verify_python_package_data.py dist/*.whl dist/*.tar.gz

  test-windows:
    name: Test Windows X64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Match windows-installers.yml. Long Torch wheel paths and the hosted
      # image's VC++ runtime need confirmation in the first hosted run.
      - name: Enable Win32 long paths
        run: Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Ensure signed Microsoft VC++ runtime
        run: ./scripts/ensure_windows_vc_runtime.ps1
      - name: Test in an isolated runner-temp environment
        run: |
          $root = Join-Path $env:RUNNER_TEMP "lsr-tests"
          New-Item -ItemType Directory -Force -Path "$root\tmp" | Out-Null
          $env:TEMP = "$root\tmp"
          $env:TMP = "$root\tmp"
          python -m venv "$root\venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = "$root\venv\Scripts\python.exe"
          & $python -m pip install --disable-pip-version-check --upgrade "pip==26.2.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --disable-pip-version-check --no-cache-dir `
            "torch==2.13.0" `
            "torchvision==0.28.0" `
            --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --disable-pip-version-check --no-cache-dir -e ".[dev,video,face]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -c "import torch, torchvision; print(f'torch={torch.__version__} torchvision={torchvision.__version__}')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pytest tests/ -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  test-macos:
    name: Test macOS arm64
    # Hosted Apple Silicon matches the shipped arm64 target.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install and run the test suite
        run: |
          python3.11 -m venv "$RUNNER_TEMP/venv"
          PYTHON="$RUNNER_TEMP/venv/bin/python"
          "$PYTHON" -m pip install --disable-pip-version-check --upgrade "pip==26.2.1"
          "$PYTHON" -m pip install --disable-pip-version-check -e ".[dev,video,face]"
          "$PYTHON" -m pytest tests/ -v
