name: Inspect Windows Storage
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, localsr-windows-builder]
    steps:
      - name: Inspect Windows storage
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $volume = Get-Volume -DriveLetter C
          $freeGiB = [math]::Round($volume.SizeRemaining / 1GB, 2)
          $sizeGiB = [math]::Round($volume.Size / 1GB, 2)
          Write-Host "Windows C: size=$sizeGiB GiB free=$freeGiB GiB"
          Write-Host "Filesystem drives:"
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, Root, Used, Free |
            Format-Table -AutoSize

          if (Test-Path -LiteralPath C:\lsr-ci) {
            Write-Host "C:\lsr-ci shallow listing:"
            Get-ChildItem -LiteralPath C:\lsr-ci -Force -ErrorAction SilentlyContinue |
              Select-Object Mode, Length, LastWriteTime, FullName |
              Format-Table -AutoSize
          }
          Write-Host "C:\actions-runner\_work shallow listing:"
          Get-ChildItem -LiteralPath C:\actions-runner\_work -Force -ErrorAction SilentlyContinue |
            Select-Object Mode, Length, LastWriteTime, FullName |
            Format-Table -AutoSize
          Write-Host "NetworkService local app data shallow listing:"
          Get-ChildItem -LiteralPath C:\WINDOWS\ServiceProfiles\NetworkService\AppData\Local -Force -ErrorAction SilentlyContinue |
            Select-Object Mode, Length, LastWriteTime, FullName |
            Format-Table -AutoSize
