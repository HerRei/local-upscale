name: Inspect Windows Storage
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, localsr-windows-builder]
    steps:
      - name: Inspect Windows storage
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          function Measure-DirectoryGiB([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path)) { return 0 }
            $sum = Get-ChildItem -LiteralPath $Path -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { -not $_.PSIsContainer } |
              Measure-Object -Property Length -Sum
            return [math]::Round(($sum.Sum / 1GB), 2)
          }

          $volume = Get-Volume -DriveLetter C
          $freeGiB = [math]::Round($volume.SizeRemaining / 1GB, 2)
          $sizeGiB = [math]::Round($volume.Size / 1GB, 2)
          Write-Host "Windows C: size=$sizeGiB GiB free=$freeGiB GiB"
          Write-Host "Known runner and cache paths by size:"
          @(
            "C:\lsr-ci",
            "C:\actions-runner\_work",
            "C:\actions-runner\_work\_temp",
            "C:\WINDOWS\ServiceProfiles\NetworkService\AppData\Local\pip",
            "C:\WINDOWS\ServiceProfiles\NetworkService\AppData\Local\npm-cache",
            "C:\WINDOWS\ServiceProfiles\NetworkService\.cargo",
            "C:\WINDOWS\Temp",
            "C:\ProgramData\chocolatey"
          ) |
            ForEach-Object {
              [PSCustomObject]@{ Path = $_; SizeGiB = Measure-DirectoryGiB $_ }
            } |
            Sort-Object SizeGiB -Descending |
            Format-Table -AutoSize

          if (Test-Path -LiteralPath C:\lsr-ci) {
            Write-Host "C:\lsr-ci children by size:"
            Get-ChildItem -LiteralPath C:\lsr-ci -Force -Directory -ErrorAction SilentlyContinue |
              ForEach-Object {
                [PSCustomObject]@{ Path = $_.FullName; SizeGiB = Measure-DirectoryGiB $_.FullName }
              } |
              Sort-Object SizeGiB -Descending |
              Format-Table -AutoSize
          }
