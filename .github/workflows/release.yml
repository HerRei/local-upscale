name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  build-linux-flavors:
    name: Build Linux (${{ matrix.target.name }})
    runs-on: [self-hosted, Linux]
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "CPU"
            pkg: "LocalSR-Linux-CPU-x86_64.tar.gz"
          - name: "CUDA"
            pkg: "LocalSR-Linux-CUDA-x86_64.tar.gz"
          - name: "Intel-XPU"
            pkg: "LocalSR-Linux-Intel-x86_64.tar.gz"
          - name: "AMD-ROCm"
            pkg: "LocalSR-Linux-ROCm-x86_64.tar.gz"

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo -n apt-get update -qq 2>/dev/null || true
          sudo -n apt-get install -qq -y libgl1 libglib2.0-0 libdbus-1-3 2>/dev/null || true

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e . pyinstaller

      - name: Build Standalone Binary
        run: |
          python3 -m PyInstaller --clean --noconfirm packaging/localsr.spec

      - name: Create Tarball
        run: |
          cd dist
          tar -czvf ${{ matrix.target.pkg }} LocalSR/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.pkg }}
          path: dist/${{ matrix.target.pkg }}

      - name: Clean Local Build Directory
        if: always()
        run: |
          rm -rf build/ dist/ *.egg-info

  build-windows-flavors:
    name: Build Windows (${{ matrix.target.name }})
    runs-on: [self-hosted, Windows]
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "CPU"
            pkg: "LocalSR-Windows-CPU-x86_64.zip"
          - name: "DirectML"
            pkg: "LocalSR-Windows-DirectML-x86_64.zip"
          - name: "CUDA"
            pkg: "LocalSR-Windows-CUDA-x86_64.zip"
    steps:
      - uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build Windows Standalone Binary
        run: |
          pyinstaller --clean --noconfirm packaging/localsr.spec

      - name: Create Windows Zip Archive
        run: |
          Compress-Archive -Path dist/LocalSR -DestinationPath dist/${{ matrix.target.pkg }}

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.pkg }}
          path: dist/${{ matrix.target.pkg }}

      - name: Clean Local Build Directory
        if: always()
        run: |
          Remove-Item -Path build, dist, *.egg-info -Recurse -Force -ErrorAction SilentlyContinue

  publish-release:
    name: Publish Release Assets
    needs: [build-linux-flavors, build-windows-flavors]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
          generate_release_notes: true

      - name: Clean Downloaded Release Artifacts
        if: always()
        run: |
          rm -rf release-artifacts/
