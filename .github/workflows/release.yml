name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Application Bundle
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller pyobjc-framework-Cocoa

      - name: Build macOS App Bundle
        run: |
          pyinstaller --clean --noconfirm packaging/localsr.spec

      - name: Create macOS Zip Archive
        run: |
          cd dist
          zip -r -y LocalSR-macOS-arm64.zip LocalSR.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalSR-macOS-arm64
          path: dist/LocalSR-macOS-arm64.zip

  build-linux:
    name: Build Linux Standalone Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y libgl1 libglib2.0-0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build Linux Binary
        run: |
          pyinstaller --clean --noconfirm packaging/localsr.spec

      - name: Create Linux Tarball
        run: |
          cd dist
          tar -czvf LocalSR-Linux-x86_64.tar.gz LocalSR/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalSR-Linux-x86_64
          path: dist/LocalSR-Linux-x86_64.tar.gz

  build-windows:
    name: Build Windows Standalone Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build Windows Binary
        run: |
          pyinstaller --clean --noconfirm packaging/localsr.spec

      - name: Create Windows Zip Archive
        run: |
          Compress-Archive -Path dist/LocalSR -DestinationPath dist/LocalSR-Windows-x86_64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalSR-Windows-x86_64
          path: dist/LocalSR-Windows-x86_64.zip

  publish-release:
    name: Publish Release Assets
    needs: [build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/LocalSR-macOS-arm64/LocalSR-macOS-arm64.zip
            release-artifacts/LocalSR-Linux-x86_64/LocalSR-Linux-x86_64.tar.gz
            release-artifacts/LocalSR-Windows-x86_64/LocalSR-Windows-x86_64.zip
          generate_release_notes: true
