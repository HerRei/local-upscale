name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localsr-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_BREAK_SYSTEM_PACKAGES: "1"
  CI_ARTIFACT_SERVER: "http://192.168.9.134:8000"
  PYTORCH_VERSION: "2.12.1"
  TORCHVISION_VERSION: "0.27.1"
  PYINSTALLER_VERSION: "6.22.2"

jobs:
  storage-preflight:
    name: Storage Preflight Check
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Prune only eligible managed CI storage
        run: |
          python3 scripts/ci_artifact_maintenance.py --root /mnt/hdd/ci-artifacts
          python3 scripts/ci_scratch.py init --root /ci-scratch
          python3 scripts/ci_scratch.py cleanup --root /ci-scratch --cache-max-gib 2
      - name: Enforce SSD and HDD build budget
        run: |
          mkdir -p "/mnt/hdd/ci-artifacts/${{ github.run_id }}/${{ github.run_attempt }}"
          python3 scripts/storage_preflight.py \
            --ssd-path / \
            --hdd-path /mnt/hdd \
            --ssd-peak-gib 20 \
            --hdd-peak-gib 20 \
            --metrics "/mnt/hdd/ci-artifacts/${{ github.run_id }}/${{ github.run_attempt }}/preflight.json"
      - name: Check artifact receiver
        run: curl --fail --silent --show-error "$CI_ARTIFACT_SERVER/healthz"

  build-linux-flavors:
    name: Build Linux (${{ matrix.target.name }})
    needs: [storage-preflight]
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target:
          - name: "CPU"
            backend: "CPU"
            pkg: "LocalSR-Linux-CPU-x86_64.tar.gz"
            index: "cpu"
          - name: "CUDA"
            backend: "CUDA"
            pkg: "LocalSR-Linux-CUDA-x86_64.tar.gz"
            index: "cu126"
          - name: "Intel-XPU"
            backend: "Intel-XPU"
            pkg: "LocalSR-Linux-Intel-x86_64.tar.gz"
            index: "xpu"
          - name: "AMD-ROCm"
            backend: "AMD-ROCm"
            pkg: "LocalSR-Linux-ROCm-x86_64.tar.gz"
            index: "rocm7.2"
    env:
      PIP_CACHE_DIR: /ci-scratch/cache/pip
      PYINSTALLER_CONFIG_DIR: /ci-scratch/cache/pyinstaller
    steps:
      - uses: actions/checkout@v4
      - name: Allocate lock-protected SSD scratch
        id: scratch
        run: |
          python3 scripts/ci_scratch.py init --root /ci-scratch
          python3 scripts/ci_scratch.py start \
            --root /ci-scratch \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --platform linux \
            --flavor "${{ matrix.target.name }}" \
            --github-output "$GITHUB_OUTPUT"
      - name: Install system dependencies
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -qq -y libgl1 libglib2.0-0 libdbus-1-3
      - name: Create isolated backend environment
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          export TMPDIR="$RUN_ROOT/tmp"
          "$HOME/.venv-ci/bin/python3.11" -m venv "$RUN_ROOT/environment/venv"
          PYTHON="$RUN_ROOT/environment/venv/bin/python"
          "$PYTHON" -m pip install --upgrade pip
          "$PYTHON" -m pip install \
            "torch==$PYTORCH_VERSION" \
            "torchvision==$TORCHVISION_VERSION" \
            --index-url "https://download.pytorch.org/whl/${{ matrix.target.index }}"
          "$PYTHON" -m pip install -e . "pyinstaller==$PYINSTALLER_VERSION"
          "$PYTHON" scripts/backend_probe.py \
            --backend "${{ matrix.target.backend }}" \
            --output "$RUN_ROOT/staging/backend-probe.json"
      - name: Build and archive on SSD
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          PYTHON="$RUN_ROOT/environment/venv/bin/python"
          "$PYTHON" -m PyInstaller --clean --noconfirm \
            --workpath "$RUN_ROOT/build" \
            --distpath "$RUN_ROOT/dist" \
            packaging/localsr.spec
          "$PYTHON" scripts/smoke_frozen_worker.py "$RUN_ROOT/dist/LocalSR" \
            --report "$RUN_ROOT/staging/package-smoke.json"
          tar -C "$RUN_ROOT/dist" -czf "$RUN_ROOT/staging/${{ matrix.target.pkg }}" LocalSR
      - name: Verify, checksum, and write metadata before transfer
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          ARTIFACT="$RUN_ROOT/staging/${{ matrix.target.pkg }}"
          python3 scripts/write_artifact_metadata.py "$ARTIFACT" \
            --commit "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --platform linux \
            --architecture x86_64 \
            --backend "${{ matrix.target.backend }}" \
            --backend-probe "$RUN_ROOT/staging/backend-probe.json" \
            --smoke-report "$RUN_ROOT/staging/package-smoke.json"
          python3 tests/verify_artifacts.py "$RUN_ROOT/staging" --only "${{ matrix.target.pkg }}"
      - name: Atomically stage verified files to HDD
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
          CI_ARTIFACT_TOKEN: ${{ secrets.CI_ARTIFACT_TOKEN }}
        run: |
          ARTIFACT="$RUN_ROOT/staging/${{ matrix.target.pkg }}"
          python3 scripts/upload_artifacts.py \
            --server "$CI_ARTIFACT_SERVER" \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --platform linux \
            "$ARTIFACT" \
            "$ARTIFACT.sha256" \
            "$ARTIFACT.metadata.json" \
            "$ARTIFACT.architecture.txt"
      - name: Remove verified completed SSD scratch
        if: success()
        run: |
          python3 scripts/ci_scratch.py finish \
            --root /ci-scratch \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --platform linux \
            --flavor "${{ matrix.target.name }}" \
            --status complete \
            --cleanup
      - name: Mark failed scratch for bounded retention
        if: failure() || cancelled()
        run: |
          if [ -n "${{ steps.scratch.outputs.run_root }}" ]; then
            python3 scripts/ci_scratch.py finish \
              --root /ci-scratch \
              --run-id "${{ github.run_id }}" \
              --attempt "${{ github.run_attempt }}" \
              --platform linux \
              --flavor "${{ matrix.target.name }}" \
              --status failed || true
          fi

  build-windows-flavors:
    name: Build Windows (${{ matrix.target.name }})
    needs: [build-linux-flavors]
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target:
          - name: "CPU-x86_64"
            backend: "CPU"
            pkg: "LocalSR-Windows-CPU-x86_64.zip"
            index: "cpu"
          - name: "DirectML-x86_64"
            backend: "DirectML"
            pkg: "LocalSR-Windows-DirectML-x86_64.zip"
            index: ""
          - name: "CUDA-x86_64"
            backend: "CUDA"
            pkg: "LocalSR-Windows-CUDA-x86_64.zip"
            index: "cu126"
    steps:
      - uses: actions/checkout@v4
      - name: Ensure signed Microsoft VC++ runtime
        run: ./scripts/ensure_windows_vc_runtime.ps1
      - name: Allocate bounded Windows scratch
        run: |
          ./scripts/ensure_windows_scratch.ps1 -MinimumFreeGiB 20
          $base = Join-Path $env:RUNNER_TEMP "LocalSR-CI"
          $runRoot = Join-Path $base "${{ github.run_id }}\${{ github.run_attempt }}\windows\${{ matrix.target.name }}"
          New-Item -ItemType Directory -Force -Path $runRoot | Out-Null
          "LOCALSR_RUN_ROOT=$runRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Create isolated backend environment
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALSR_RUN_ROOT "tmp") | Out-Null
          $env:TEMP = Join-Path $env:LOCALSR_RUN_ROOT "tmp"
          $env:TMP = $env:TEMP
          $venv = Join-Path $env:LOCALSR_RUN_ROOT "venv"
          python -m venv $venv
          $python = Join-Path $venv "Scripts\python.exe"
          & $python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("${{ matrix.target.backend }}" -eq "DirectML") {
            & $python -m pip install --no-cache-dir "torch-directml==0.2.5.dev240914"
          } else {
            & $python -m pip install --no-cache-dir "torch==$env:PYTORCH_VERSION" "torchvision==$env:TORCHVISION_VERSION" --index-url "https://download.pytorch.org/whl/${{ matrix.target.index }}"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-cache-dir -e . "pyinstaller==$env:PYINSTALLER_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALSR_RUN_ROOT "staging") | Out-Null
          & $python scripts/backend_probe.py --backend "${{ matrix.target.backend }}" --output (Join-Path $env:LOCALSR_RUN_ROOT "staging\backend-probe.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and archive
        run: |
          $python = Join-Path $env:LOCALSR_RUN_ROOT "venv\Scripts\python.exe"
          $work = Join-Path $env:LOCALSR_RUN_ROOT "build"
          $dist = Join-Path $env:LOCALSR_RUN_ROOT "dist"
          & $python -m PyInstaller --clean --noconfirm --workpath $work --distpath $dist packaging/localsr.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokeTimeout = if ("${{ matrix.target.backend }}" -eq "CPU") { 180 } else { 600 }
          if ("${{ matrix.target.backend }}" -eq "DirectML") {
            # This packaging VM has no passed-through D3D12 adapter. Validate the
            # packaged module above, then smoke-test worker IPC without allowing
            # torch-directml's hardware enumeration to block indefinitely.
            $env:LOCALSR_SKIP_DIRECTML_PROBE = "1"
          }
          & $python scripts/smoke_frozen_worker.py (Join-Path $dist "LocalSR") --timeout $smokeTimeout --report (Join-Path $env:LOCALSR_RUN_ROOT "staging\package-smoke.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $env:LOCALSR_RUN_ROOT "staging\${{ matrix.target.pkg }}"
          & $python -c "import shutil,sys; shutil.make_archive(sys.argv[1][:-4], 'zip', sys.argv[2], 'LocalSR')" $archive $dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify, checksum, and write metadata before transfer
        run: |
          $python = Join-Path $env:LOCALSR_RUN_ROOT "venv\Scripts\python.exe"
          $artifact = Join-Path $env:LOCALSR_RUN_ROOT "staging\${{ matrix.target.pkg }}"
          & $python scripts/write_artifact_metadata.py $artifact --commit "${{ github.sha }}" --run-id "${{ github.run_id }}" --attempt "${{ github.run_attempt }}" --platform windows --architecture x86_64 --backend "${{ matrix.target.backend }}" --backend-probe (Join-Path $env:LOCALSR_RUN_ROOT "staging\backend-probe.json") --smoke-report (Join-Path $env:LOCALSR_RUN_ROOT "staging\package-smoke.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python tests/verify_artifacts.py (Join-Path $env:LOCALSR_RUN_ROOT "staging") --only "${{ matrix.target.pkg }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Atomically stage verified files to HDD
        env:
          CI_ARTIFACT_TOKEN: ${{ secrets.CI_ARTIFACT_TOKEN }}
        run: |
          $python = Join-Path $env:LOCALSR_RUN_ROOT "venv\Scripts\python.exe"
          $artifact = Join-Path $env:LOCALSR_RUN_ROOT "staging\${{ matrix.target.pkg }}"
          & $python scripts/upload_artifacts.py --server $env:CI_ARTIFACT_SERVER --run-id "${{ github.run_id }}" --attempt "${{ github.run_attempt }}" --platform windows $artifact "$artifact.sha256" "$artifact.metadata.json" "$artifact.architecture.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove this Windows scratch after artifact handling
        if: always()
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LOCALSR_RUN_ROOT)) {
            Write-Host "No Windows scratch path was allocated"
            exit 0
          }
          $base = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP "LocalSR-CI")) + [IO.Path]::DirectorySeparatorChar
          $target = [IO.Path]::GetFullPath($env:LOCALSR_RUN_ROOT)
          if (-not $target.StartsWith($base, [StringComparison]::OrdinalIgnoreCase)) { throw "Unsafe cleanup target: $target" }
          if (Test-Path -LiteralPath $target) {
            Remove-Item -LiteralPath $target -Recurse -Force
          }

  build-macos-flavors:
    name: Build macOS (${{ matrix.target.name }})
    needs: [build-windows-flavors]
    runs-on: [self-hosted, macOS, X64]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target:
          - name: "x86_64-CPU"
            architecture: "x86_64"
            backend: "CPU"
            pkg: "LocalSR-macOS-x86_64.tar.gz"
          - name: "arm64-MPS-cross"
            architecture: "arm64"
            backend: "MPS"
            pkg: "LocalSR-macOS-arm64.tar.gz"
    env:
      CI_SCRATCH: /Volumes/CISCRATCH
      PIP_CACHE_DIR: /Volumes/CISCRATCH/cache/pip
      PYINSTALLER_CONFIG_DIR: /Volumes/CISCRATCH/cache/pyinstaller
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - name: Enforce guest SSD budget and allocate scratch
        id: scratch
        run: |
          python3 scripts/ci_scratch.py init --root "$CI_SCRATCH"
          python3 scripts/ci_scratch.py cleanup --root "$CI_SCRATCH" --cache-max-gib 2
          python3 scripts/storage_preflight.py \
            --ssd-path "$CI_SCRATCH" \
            --skip-hdd \
            --ssd-min-percent 20 \
            --ssd-min-gib 6 \
            --ssd-peak-gib 15
          python3 scripts/ci_scratch.py start \
            --root "$CI_SCRATCH" \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --platform macos \
            --flavor "${{ matrix.target.name }}" \
            --github-output "$GITHUB_OUTPUT"
      - name: Copy working set to local SSD block device
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          mkdir -p "$RUN_ROOT/source"
          rsync -a --exclude .git "$GITHUB_WORKSPACE/" "$RUN_ROOT/source/"
      - name: Create isolated x86_64 environment
        if: matrix.target.architecture == 'x86_64'
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          export TMPDIR="$RUN_ROOT/tmp"
          python3.11 -m venv "$RUN_ROOT/environment/venv"
          PYTHON="$RUN_ROOT/environment/venv/bin/python"
          "$PYTHON" -m pip install --upgrade pip
          "$PYTHON" -m pip install \
            -r "$RUN_ROOT/source/requirements/macos-cross-build.txt" \
            -r "$RUN_ROOT/source/requirements/macos-cross-tools.txt"
          "$PYTHON" -m pip install --no-deps -e "$RUN_ROOT/source"
          "$PYTHON" "$RUN_ROOT/source/scripts/backend_probe.py" \
            --backend CPU \
            --output "$RUN_ROOT/staging/backend-probe.json"
      - name: Create genuine universal2 analysis environment
        if: matrix.target.architecture == 'arm64'
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          export TMPDIR="$RUN_ROOT/tmp"
          UNIVERSAL_PYTHON=/Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11
          test -x "$UNIVERSAL_PYTHON"
          lipo -archs "$UNIVERSAL_PYTHON" | grep -q x86_64
          lipo -archs "$UNIVERSAL_PYTHON" | grep -q arm64
          "$UNIVERSAL_PYTHON" -m venv "$RUN_ROOT/environment/venv"
          PYTHON="$RUN_ROOT/environment/venv/bin/python"
          "$PYTHON" -m pip install --upgrade pip
          "$PYTHON" -m pip install -r "$RUN_ROOT/source/requirements/macos-cross-tools.txt"
          "$PYTHON" "$RUN_ROOT/source/scripts/macos_cross_wheels.py" prepare \
            --requirements "$RUN_ROOT/source/requirements/macos-cross-build.txt" \
            --output "$RUN_ROOT/wheels"
          "$PYTHON" -m pip install \
            --no-index \
            --find-links "$RUN_ROOT/wheels/wheelhouse" \
            -r "$RUN_ROOT/source/requirements/macos-cross-build.txt"
          "$PYTHON" -m pip install --no-deps -e "$RUN_ROOT/source"
          SITE_PACKAGES=$("$PYTHON" -c 'import site; print(site.getsitepackages()[0])')
          "$PYTHON" "$RUN_ROOT/source/scripts/macos_cross_wheels.py" normalize-openmp \
            --site-packages "$SITE_PACKAGES" \
            --report "$RUN_ROOT/staging/openmp-normalization.json"
          "$PYTHON" "$RUN_ROOT/source/scripts/verify_macho_tree.py" "$SITE_PACKAGES" \
            --require x86_64,arm64 \
            --exclude 'delocate/tests/data/*' \
            --report "$RUN_ROOT/staging/universal2-environment.json"
          "$PYTHON" "$RUN_ROOT/source/scripts/backend_probe.py" \
            --backend MPS \
            --output "$RUN_ROOT/staging/backend-probe.json"
      - name: Build target architecture entirely on SSD
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
          LOCALSR_TARGET_ARCH: ${{ matrix.target.architecture }}
        run: |
          export TMPDIR="$RUN_ROOT/tmp"
          export LOCALSR_NATIVE_BUILD_DIR="$RUN_ROOT/build/native"
          PYTHON="$RUN_ROOT/environment/venv/bin/python"
          cd "$RUN_ROOT/source"
          "$PYTHON" -m PyInstaller --clean --noconfirm \
            --workpath "$RUN_ROOT/build/pyinstaller" \
            --distpath "$RUN_ROOT/dist" \
            packaging/localsr.spec
          "$PYTHON" scripts/verify_macho_tree.py "$RUN_ROOT/dist/LocalSR" \
            --require "${{ matrix.target.architecture }}" \
            --main "$RUN_ROOT/dist/LocalSR/LocalSR" \
            --report "$RUN_ROOT/staging/bundle-macho.json"
          if [ "${{ matrix.target.architecture }}" = x86_64 ]; then
            "$PYTHON" scripts/smoke_frozen_worker.py "$RUN_ROOT/dist/LocalSR" \
              --report "$RUN_ROOT/staging/package-smoke.json"
          fi
          tar -C "$RUN_ROOT/dist" -czf "$RUN_ROOT/staging/${{ matrix.target.pkg }}" LocalSR
      - name: Verify, checksum, and write metadata before transfer
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
        run: |
          ARTIFACT="$RUN_ROOT/staging/${{ matrix.target.pkg }}"
          WHEEL_ARGUMENTS=()
          SMOKE_ARGUMENTS=()
          if [ "${{ matrix.target.architecture }}" = arm64 ]; then
            WHEEL_ARGUMENTS=(
              --wheel-manifest "$RUN_ROOT/wheels/wheel-manifest.json"
              --normalization-report "$RUN_ROOT/staging/openmp-normalization.json"
            )
          else
            SMOKE_ARGUMENTS=(--smoke-report "$RUN_ROOT/staging/package-smoke.json")
          fi
          "$RUN_ROOT/environment/venv/bin/python" "$RUN_ROOT/source/scripts/write_artifact_metadata.py" \
            "$ARTIFACT" \
            --commit "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --platform macos \
            --architecture "${{ matrix.target.architecture }}" \
            --backend "${{ matrix.target.backend }}" \
            --backend-probe "$RUN_ROOT/staging/backend-probe.json" \
            "${SMOKE_ARGUMENTS[@]}" \
            "${WHEEL_ARGUMENTS[@]}"
          "$RUN_ROOT/environment/venv/bin/python" "$RUN_ROOT/source/tests/verify_artifacts.py" \
            "$RUN_ROOT/staging" \
            --manifest "$RUN_ROOT/source/ci/release-artifacts.json" \
            --only "${{ matrix.target.pkg }}"
      - name: Atomically stage verified files to HDD
        env:
          RUN_ROOT: ${{ steps.scratch.outputs.run_root }}
          CI_ARTIFACT_TOKEN: ${{ secrets.CI_ARTIFACT_TOKEN }}
        run: |
          ARTIFACT="$RUN_ROOT/staging/${{ matrix.target.pkg }}"
          "$RUN_ROOT/environment/venv/bin/python" "$RUN_ROOT/source/scripts/upload_artifacts.py" \
            --server "$CI_ARTIFACT_SERVER" \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --platform macos \
            "$ARTIFACT" \
            "$ARTIFACT.sha256" \
            "$ARTIFACT.metadata.json" \
            "$ARTIFACT.architecture.txt"
      - name: Remove verified completed SSD scratch
        if: success()
        run: |
          python3 scripts/ci_scratch.py finish \
            --root "$CI_SCRATCH" \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --platform macos \
            --flavor "${{ matrix.target.name }}" \
            --status complete \
            --cleanup
      - name: Mark failed scratch for bounded retention
        if: failure() || cancelled()
        run: |
          if [ -n "${{ steps.scratch.outputs.run_root }}" ]; then
            python3 scripts/ci_scratch.py finish \
              --root "$CI_SCRATCH" \
              --run-id "${{ github.run_id }}" \
              --attempt "${{ github.run_attempt }}" \
              --platform macos \
              --flavor "${{ matrix.target.name }}" \
              --status failed || true
          fi

  verify-artifacts:
    name: Verify complete HDD artifact matrix
    needs: [build-macos-flavors]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Re-check HDD checksums and all native binaries
        run: |
          ROOT="/mnt/hdd/ci-artifacts/${{ github.run_id }}/${{ github.run_attempt }}"
          touch "$ROOT/.validating"
          trap 'rm -f "$ROOT/.validating"' EXIT
          python3 tests/verify_artifacts.py "$ROOT"
          python3 -c 'import json,sys; from datetime import datetime,timezone; open(sys.argv[1],"w").write(json.dumps({"timestamp":datetime.now(timezone.utc).isoformat(),"status":"complete"})+"\n")' "$ROOT/.complete"
      - name: Enforce reserves after transfer
        run: |
          python3 scripts/storage_preflight.py \
            --ssd-path / \
            --hdd-path /mnt/hdd \
            --ssd-peak-gib 0 \
            --hdd-peak-gib 0

  publish-release:
    name: Publish and confirm GitHub Release assets
    needs: [verify-artifacts]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, Linux, X64]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare assets within GitHub's per-file limit
        run: |
          ROOT="/mnt/hdd/ci-artifacts/${{ github.run_id }}/${{ github.run_attempt }}"
          touch "$ROOT/.publishing"
          python3 scripts/prepare_release_assets.py "$ROOT" \
            --manifest ci/release-artifacts.json \
            --output "$ROOT/release-assets"
      - name: Create release and upload all prepared assets
        run: |
          ROOT="/mnt/hdd/ci-artifacts/${{ github.run_id }}/${{ github.run_attempt }}"
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --verify-tag
          while IFS= read -r asset; do
            gh release upload "$TAG" "$asset" --clobber
          done < "$ROOT/release-assets/release-files.txt"
          gh release view "$TAG" --json assets > "$ROOT/release-assets/github-release.json"
          python3 scripts/confirm_release_assets.py \
            --index "$ROOT/release-assets/release-index.json" \
            --release-json "$ROOT/release-assets/github-release.json"
          python3 -c 'import json,sys; from datetime import datetime,timezone; open(sys.argv[1],"w").write(json.dumps({"timestamp":datetime.now(timezone.utc).isoformat(),"status":"published"})+"\n")' "$ROOT/.published"
          rm -f "$ROOT/.publishing"

  retention-maintenance:
    name: Final bounded retention pass
    needs: [verify-artifacts, publish-release]
    if: always()
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Enforce HDD and SSD retention limits
        run: |
          python3 scripts/ci_artifact_maintenance.py --root /mnt/hdd/ci-artifacts
          python3 scripts/ci_scratch.py cleanup --root /ci-scratch --cache-max-gib 2
