name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  build-linux-flavors:
    name: Build Linux (${{ matrix.target.name }})
    runs-on: [self-hosted, Linux]
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "CPU"
            pkg: "LocalSR-Linux-CPU-x86_64.tar.gz"
          - name: "CUDA"
            pkg: "LocalSR-Linux-CUDA-x86_64.tar.gz"
          - name: "Intel-XPU"
            pkg: "LocalSR-Linux-Intel-x86_64.tar.gz"
          - name: "AMD-ROCm"
            pkg: "LocalSR-Linux-ROCm-x86_64.tar.gz"

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo -n apt-get update -qq 2>/dev/null || true
          sudo -n apt-get install -qq -y libgl1 libglib2.0-0 libdbus-1-3 2>/dev/null || true

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e . pyinstaller

      - name: Build Standalone Binary
        run: |
          python3 -m PyInstaller --clean --noconfirm packaging/localsr.spec

      - name: Create Tarball
        run: |
          cd dist
          tar -czvf ${{ matrix.target.pkg }} LocalSR/

      - name: Stage Artifact
        run: |
          mkdir -p /mnt/hdd/ci-artifacts/${{ github.run_id }}/${{ github.run_attempt }}/linux
          cp dist/${{ matrix.target.pkg }} /mnt/hdd/ci-artifacts/${{ github.run_id }}/${{ github.run_attempt }}/linux/
      - name: Generate Checksum
        run: |
          cd dist
          sha256sum ${{ matrix.target.pkg }} > ${{ matrix.target.pkg }}.sha256
      - name: Stage Checksum
        run: cp dist/${{ matrix.target.pkg }}.sha256 /mnt/hdd/ci-artifacts/${{ github.run_id }}/${{ github.run_attempt }}/linux/

      - name: Clean Local Build Directory
        if: always()
        run: |
          rm -rf build/ dist/ *.egg-info

  build-macos-flavors:
    name: Build macOS (${{ matrix.target.name }})
    runs-on: [self-hosted, macOS]
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "x86_64-CPU"
            pkg: "LocalSR-macOS-x86_64.tar.gz"
          - name: "arm64-MPS"
            pkg: "LocalSR-macOS-arm64.tar.gz"
    steps:
      - uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: |
          curl -sS https://bootstrap.pypa.io/get-pip.py -o get-pip.py
          python3.11 get-pip.py
          python3.11 -m pip install --upgrade pip
          python3.11 -m pip install -e . pyinstaller pyobjc-framework-Cocoa

      - name: Build macOS Standalone Binary (x86_64)
        if: matrix.target.name == 'x86_64-CPU'
        run: |
          python3.11 -m PyInstaller --clean --noconfirm packaging/localsr.spec

      - name: Build macOS ARM64 Binary (cross-compile with MPS)
        if: matrix.target.name == 'arm64-MPS'
        run: |
          export ARCHFLAGS="-arch arm64"
          export CMAKE_OSX_ARCHITECTURES=arm64
          python3.11 -m PyInstaller --clean --noconfirm packaging/localsr.spec
        env:
          USE_MPS: "1"

      - name: Create macOS Archive
        run: |
          cd dist
          tar -czvf ${{ matrix.target.pkg }} LocalSR/

      - name: Stage Artifact
        run: |
          mkdir -p /Volumes/shared/ci-artifacts/${{ github.run_id }}/${{ github.run_attempt }}/macos
          cp dist/${{ matrix.target.pkg }} /Volumes/shared/ci-artifacts/${{ github.run_id }}/${{ github.run_attempt }}/macos/
      - name: Generate Checksum
        run: |
          cd dist
          shasum -a 256 ${{ matrix.target.pkg }} > ${{ matrix.target.pkg }}.sha256
      - name: Stage Checksum
        run: cp dist/${{ matrix.target.pkg }}.sha256 /Volumes/shared/ci-artifacts/${{ github.run_id }}/${{ github.run_attempt }}/macos/

      - name: Clean Local Build Directory
        if: always()
        run: |
          rm -rf build/ dist/ *.egg-info

  build-windows-flavors:
    name: Build Windows (${{ matrix.target.name }})
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: cmd
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "CPU-x86_64"
            pkg: "LocalSR-Windows-CPU-x86_64.zip"
          - name: "DirectML-x86_64"
            pkg: "LocalSR-Windows-DirectML-x86_64.zip"
          - name: "CUDA-x86_64"
            pkg: "LocalSR-Windows-CUDA-x86_64.zip"
    steps:
      - uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Install DirectML Support
        if: contains(matrix.target.name, 'DirectML')
        run: |
          python -m pip install torch-directml

      - name: Build Windows Standalone Binary
        run: |
          pyinstaller --clean --noconfirm packaging/localsr.spec

      - name: Create Windows Zip Archive
        run: |
          powershell -c "Compress-Archive -Path dist/LocalSR -DestinationPath dist/${{ matrix.target.pkg }}"

      - name: Stage Artifact
        run: |
          powershell -c "New-Item -ItemType Directory -Force -Path \\host.lan\Data\ci-artifacts\${{ github.run_id }}\${{ github.run_attempt }}\windows"
          powershell -c "Copy-Item dist\${{ matrix.target.pkg }} -Destination \\host.lan\Data\ci-artifacts\${{ github.run_id }}\${{ github.run_attempt }}\windows"
      - name: Generate Checksum
        run: |
          powershell -c "(Get-FileHash dist\${{ matrix.target.pkg }} -Algorithm SHA256).Hash | Out-File dist\${{ matrix.target.pkg }}.sha256 -Encoding utf8"
      - name: Stage Checksum
        run: powershell -c "Copy-Item dist\${{ matrix.target.pkg }}.sha256 -Destination \\host.lan\Data\ci-artifacts\${{ github.run_id }}\${{ github.run_attempt }}\windows" 

      - name: Clean Local Build Directory
        if: always()
        run: |
          powershell -c "Remove-Item -Path build, dist, *.egg-info -Recurse -Force -ErrorAction SilentlyContinue"

  verify-artifacts:
    name: Verify Artifacts Architecture
    needs: [build-linux-flavors, build-windows-flavors, build-macos-flavors]
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Architecture and Formats
        run: python3 tests/verify_artifacts.py /mnt/hdd/ci-artifacts/${{ github.run_id }}/${{ github.run_attempt }}

  publish-release:
    name: Publish Release Assets
    needs: [verify-artifacts]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /mnt/hdd/ci-artifacts/${{ github.run_id }}/${{ github.run_attempt }}/**/*.tar.gz
            /mnt/hdd/ci-artifacts/${{ github.run_id }}/${{ github.run_attempt }}/**/*.zip
            /mnt/hdd/ci-artifacts/${{ github.run_id }}/${{ github.run_attempt }}/**/*.sha256
          generate_release_notes: true
      - name: Post-Release Artifact Cleanup
        if: always()
        run: python3 /mnt/hdd/cleanup-artifacts.py ${{ github.run_id }}
