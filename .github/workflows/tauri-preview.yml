name: Tauri Next Preview

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "protocol/**"
      - "src/localsr/protocol/**"
      - "src/localsr/worker/**"
      - "src/localsr/core/hardware.py"
      - "src/localsr/core/inference.py"
      - "src/localsr/core/model_catalog.py"
      - "src/localsr/core/video_*.py"
      - "src/localsr/video_models/**"
      - "scripts/export_desktop_catalog.py"
      - "scripts/build_tauri_preview.py"
      - "scripts/install_windows_rust.ps1"
      - "scripts/smoke_tauri_installer.py"
      - "packaging/tauri_worker.spec"
      - "tests/test_hardware.py"
      - "tests/test_inference.py"
      - "tests/test_worker_protocol_contract.py"
      - "tests/test_tauri_installer_smoke.py"
      - ".github/workflows/tauri-preview.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "protocol/**"
      - "src/localsr/protocol/**"
      - "src/localsr/worker/**"
      - "src/localsr/core/hardware.py"
      - "src/localsr/core/inference.py"
      - "src/localsr/core/model_catalog.py"
      - "src/localsr/core/video_*.py"
      - "src/localsr/video_models/**"
      - "scripts/export_desktop_catalog.py"
      - "scripts/build_tauri_preview.py"
      - "scripts/install_windows_rust.ps1"
      - "scripts/smoke_tauri_installer.py"
      - "packaging/tauri_worker.spec"
      - "tests/test_hardware.py"
      - "tests/test_inference.py"
      - "tests/test_worker_protocol_contract.py"
      - "tests/test_tauri_installer_smoke.py"
      - ".github/workflows/tauri-preview.yml"
  workflow_dispatch:
    inputs:
      build_packages:
        description: Build private preview installers for acceptance testing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PIP_VERSION: "26.2.1"
  PYTORCH_VERSION: "2.13.0"
  TORCHVISION_VERSION: "0.28.0"
  PYINSTALLER_VERSION: "6.22.2"

concurrency:
  group: localsr-tauri-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Next Preview (${{ matrix.platform }})
    timeout-minutes: 150
    env:
      # actions/checkout removes ignored target directories. Keep the verified
      # dependency build outside the checkout so small source changes do not
      # force hour-long cold builds on the constrained self-hosted VMs.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../.localsr-tauri-target/${{ matrix.cache_key }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux X64
            cache_key: linux-x64
            runner: '["self-hosted","Linux","X64"]'
            shell: bash
            cargo_jobs: 4
          - platform: Windows X64
            cache_key: windows-x64
            runner: '["self-hosted","Windows","X64"]'
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
            cargo_jobs: 2
          - platform: macOS X64
            cache_key: macos-x64
            runner: '["self-hosted","macOS","X64"]'
            shell: bash
            cargo_jobs: 2
    runs-on: ${{ fromJSON(matrix.runner) }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Create isolated Linux Python environment
        if: runner.os == 'Linux'
        run: |
          python3 scripts/storage_preflight.py \
            --ssd-path /ci-scratch \
            --skip-hdd \
            --ssd-peak-gib 5
          ROOT="/ci-scratch/localsr-tauri/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/verify"
          VENV="$ROOT/venv"
          mkdir -p "$ROOT/tmp" /ci-scratch/cache/pip
          export TMPDIR="$ROOT/tmp"
          "$HOME/.venv-ci/bin/python3.11" -m venv "$VENV"
          echo "LOCALSR_PREVIEW_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "LOCALSR_PREVIEW_VENV=$VENV" >> "$GITHUB_ENV"
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=/ci-scratch/cache/pip" >> "$GITHUB_ENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Create isolated macOS Python environment
        if: runner.os == 'macOS'
        run: |
          VENV="$RUNNER_TEMP/localsr-tauri/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/verify/venv"
          /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -m venv "$VENV"
          echo "LOCALSR_PREVIEW_VENV=$VENV" >> "$GITHUB_ENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Create isolated Windows Python environment
        if: runner.os == 'Windows'
        run: |
          # Keep this deliberately short: current Torch wheels contain deeply
          # nested license paths that otherwise exceed Win32 MAX_PATH.
          $root = "C:\lsr-ci\$env:GITHUB_RUN_ID\$env:GITHUB_RUN_ATTEMPT\t\verify"
          $venv = Join-Path $root "venv"
          $tmp = Join-Path $root "tmp"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          py -3.11 -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LOCALSR_PREVIEW_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOCALSR_PREVIEW_VENV=$venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $venv "Scripts") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils xvfb dbus-x11
      - name: Install the stable Rust toolchain
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Install the stable Windows Rust toolchain
        if: runner.os == 'Windows'
        run: ./scripts/install_windows_rust.ps1
      - name: Initialize the Windows MSVC build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Verify generated model policy
        run: python scripts/export_desktop_catalog.py --check
      - name: Verify Python desktop tooling and the worker contract
        env:
          PYTHONPATH: src
        run: |
          python -m pip install --disable-pip-version-check "pytest==9.0.2"
          python -m pytest tests/test_worker_protocol_contract.py tests/test_tauri_build_script.py tests/test_tauri_installer_smoke.py -q
      - name: Install locked frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Check and test the Svelte interface
        working-directory: desktop
        run: |
          npm run check
          npm test
          npm run build
      - name: Check Rust formatting
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Lint and test the native control plane
        working-directory: desktop/src-tauri
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: Remove the isolated Python environment
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          if [ -n "${LOCALSR_PREVIEW_ROOT:-}" ]; then
            echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
            rm -rf "$LOCALSR_PREVIEW_ROOT"
          elif [ -n "${LOCALSR_PREVIEW_VENV:-}" ]; then
            rm -rf "$LOCALSR_PREVIEW_VENV"
          fi
      - name: Remove the isolated Windows Python environment
        if: always() && runner.os == 'Windows'
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if ($env:LOCALSR_PREVIEW_ROOT -and (Test-Path -LiteralPath $env:LOCALSR_PREVIEW_ROOT)) {
            Remove-Item -LiteralPath $env:LOCALSR_PREVIEW_ROOT -Recurse -Force
          } elseif ($env:LOCALSR_PREVIEW_VENV -and (Test-Path -LiteralPath $env:LOCALSR_PREVIEW_VENV)) {
            Remove-Item -LiteralPath $env:LOCALSR_PREVIEW_VENV -Recurse -Force
          }

  package-preview:
    name: Package private preview (${{ matrix.os }})
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs }}
    if: github.event_name == 'workflow_dispatch' && inputs.build_packages
    needs: verify
    strategy:
      fail-fast: false
      # macOS package builds require a native ARM64 runner: the maintained
      # PyTorch line no longer publishes Intel macOS wheels. The Intel runner
      # above still verifies the Tauri control plane without reviving 2.2.x.
      matrix:
        include:
          - os: Linux
            runner: '["self-hosted","Linux","X64"]'
            shell: bash
            cargo_jobs: 4
            bundles: appimage
            package_path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: Windows
            runner: '["self-hosted","Windows","X64"]'
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
            cargo_jobs: 2
            bundles: nsis
            package_path: desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ fromJSON(matrix.runner) }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Create isolated Linux Python environment
        if: runner.os == 'Linux'
        run: |
          python3 scripts/storage_preflight.py \
            --ssd-path /ci-scratch \
            --skip-hdd \
            --ssd-peak-gib 5
          ROOT="/ci-scratch/localsr-tauri/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/package"
          VENV="$ROOT/venv"
          mkdir -p "$ROOT/tmp" /ci-scratch/cache/pip
          export TMPDIR="$ROOT/tmp"
          "$HOME/.venv-ci/bin/python3.11" -m venv "$VENV"
          echo "LOCALSR_PREVIEW_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "LOCALSR_PREVIEW_VENV=$VENV" >> "$GITHUB_ENV"
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=/ci-scratch/cache/pip" >> "$GITHUB_ENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Create isolated macOS Python environment
        if: runner.os == 'macOS'
        run: |
          VENV="$RUNNER_TEMP/localsr-tauri/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/package/venv"
          /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -m venv "$VENV"
          echo "LOCALSR_PREVIEW_VENV=$VENV" >> "$GITHUB_ENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Create isolated Windows Python environment
        if: runner.os == 'Windows'
        run: |
          # Keep this deliberately short: current Torch wheels contain deeply
          # nested license paths that otherwise exceed Win32 MAX_PATH.
          $root = "C:\lsr-ci\$env:GITHUB_RUN_ID\$env:GITHUB_RUN_ATTEMPT\t\package"
          $venv = Join-Path $root "venv"
          $tmp = Join-Path $root "tmp"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          py -3.11 -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LOCALSR_PREVIEW_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOCALSR_PREVIEW_VENV=$venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $venv "Scripts") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils xvfb dbus-x11
      - name: Install the stable Rust toolchain
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Install the stable Windows Rust toolchain
        if: runner.os == 'Windows'
        run: ./scripts/install_windows_rust.ps1
      - name: Initialize the Windows MSVC build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Install locked frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Install the Linux inference packager
        if: runner.os == 'Linux'
        run: |
          python -m pip install --disable-pip-version-check "pip==${{ env.PIP_VERSION }}"
          python -m pip install --disable-pip-version-check \
            "torch==${{ env.PYTORCH_VERSION }}" "torchvision==${{ env.TORCHVISION_VERSION }}" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            -e ".[package,video]" "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
      - name: Install the Windows inference packager
        if: runner.os == 'Windows'
        run: |
          python -m pip install --disable-pip-version-check "pip==${{ env.PIP_VERSION }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check "torch==${{ env.PYTORCH_VERSION }}" "torchvision==${{ env.TORCHVISION_VERSION }}" --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check -e ".[package,video]" "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the additive desktop package
        # The required verify matrix has already run Svelte checks and tests on
        # this exact commit. Avoid starting a second Vitest worker pool after
        # the memory-intensive PyInstaller build on constrained runner VMs.
        run: python scripts/build_tauri_preview.py --skip-checks --bundles ${{ matrix.bundles }}
      - name: Install or mount the package and boot its bundled worker
        run: python scripts/smoke_tauri_installer.py --artifact-glob "${{ matrix.package_path }}" --report build/tauri-preview/installer-smoke-${{ runner.os }}.json
      - name: Upload optional private acceptance package
        id: upload_package
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LocalSR-Next-Preview-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.package_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Report unavailable private artifact storage
        if: steps.upload_package.outcome == 'failure'
        run: echo "::warning::The installer passed its real launch smoke test, but GitHub Actions artifact storage is currently unavailable or over quota."
      - name: Remove the isolated Python environment
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          if [ -n "${LOCALSR_PREVIEW_ROOT:-}" ]; then
            echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
            rm -rf "$LOCALSR_PREVIEW_ROOT"
          elif [ -n "${LOCALSR_PREVIEW_VENV:-}" ]; then
            rm -rf "$LOCALSR_PREVIEW_VENV"
          fi
      - name: Remove the isolated Windows Python environment
        if: always() && runner.os == 'Windows'
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if ($env:LOCALSR_PREVIEW_ROOT -and (Test-Path -LiteralPath $env:LOCALSR_PREVIEW_ROOT)) {
            Remove-Item -LiteralPath $env:LOCALSR_PREVIEW_ROOT -Recurse -Force
          } elseif ($env:LOCALSR_PREVIEW_VENV -and (Test-Path -LiteralPath $env:LOCALSR_PREVIEW_VENV)) {
            Remove-Item -LiteralPath $env:LOCALSR_PREVIEW_VENV -Recurse -Force
          }
