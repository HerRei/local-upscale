name: Tauri Next Preview

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "protocol/**"
      - "src/localsr/protocol/**"
      - "src/localsr/worker/**"
      - "src/localsr/core/hardware.py"
      - "src/localsr/core/inference.py"
      - "src/localsr/core/benchmark.py"
      - "src/localsr/core/face_compositing.py"
      - "src/localsr/core/face_detection.py"
      - "src/localsr/core/image_io.py"
      - "src/localsr/core/live_preview.py"
      - "src/localsr/core/model_adapter.py"
      - "src/localsr/core/model_catalog.py"
      - "src/localsr/core/output_writer.py"
      - "src/localsr/core/pipeline.py"
      - "src/localsr/core/video_*.py"
      - "src/localsr/automation.py"
      - "src/localsr/video_models/**"
      - "scripts/export_desktop_catalog.py"
      - "scripts/check_desktop_architecture.py"
      - "scripts/build_tauri_preview.py"
      - "scripts/collect_xpu_runtime.py"
      - "scripts/install_windows_rust.ps1"
      - "scripts/smoke_tauri_installer.py"
      - "scripts/verify_tauri_release_package.py"
      - "scripts/verify_macos_tauri_signing.py"
      - "scripts/verify_windows_tauri_signing.ps1"
      - "scripts/prepare_tauri_release_assets.py"
      - "packaging/tauri_worker.spec"
      - "tests/test_hardware.py"
      - "tests/test_inference.py"
      - "tests/test_desktop_architecture.py"
      - "tests/test_worker_protocol_contract.py"
      - "tests/test_tauri_installer_smoke.py"
      - "tests/test_tauri_release_tools.py"
      - "pyproject.toml"
      - ".github/workflows/tauri-preview.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "protocol/**"
      - "src/localsr/protocol/**"
      - "src/localsr/worker/**"
      - "src/localsr/core/hardware.py"
      - "src/localsr/core/inference.py"
      - "src/localsr/core/benchmark.py"
      - "src/localsr/core/face_compositing.py"
      - "src/localsr/core/face_detection.py"
      - "src/localsr/core/image_io.py"
      - "src/localsr/core/live_preview.py"
      - "src/localsr/core/model_adapter.py"
      - "src/localsr/core/model_catalog.py"
      - "src/localsr/core/output_writer.py"
      - "src/localsr/core/pipeline.py"
      - "src/localsr/core/video_*.py"
      - "src/localsr/automation.py"
      - "src/localsr/video_models/**"
      - "scripts/export_desktop_catalog.py"
      - "scripts/check_desktop_architecture.py"
      - "scripts/build_tauri_preview.py"
      - "scripts/collect_xpu_runtime.py"
      - "scripts/install_windows_rust.ps1"
      - "scripts/smoke_tauri_installer.py"
      - "scripts/verify_tauri_release_package.py"
      - "scripts/verify_macos_tauri_signing.py"
      - "scripts/verify_windows_tauri_signing.ps1"
      - "scripts/prepare_tauri_release_assets.py"
      - "packaging/tauri_worker.spec"
      - "tests/test_hardware.py"
      - "tests/test_inference.py"
      - "tests/test_desktop_architecture.py"
      - "tests/test_worker_protocol_contract.py"
      - "tests/test_tauri_installer_smoke.py"
      - "tests/test_tauri_release_tools.py"
      - "pyproject.toml"
      - ".github/workflows/tauri-preview.yml"
  workflow_dispatch:
    inputs:
      build_packages:
        description: Build private preview installers for acceptance testing
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

env:
  PIP_VERSION: "26.2.1"
  PIP_NO_CACHE_DIR: "1"
  PYTORCH_VERSION: "2.13.0"
  TORCHVISION_VERSION: "0.28.0"
  PYINSTALLER_VERSION: "6.22.2"

concurrency:
  group: localsr-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Next Preview (${{ matrix.platform }})
    timeout-minutes: 150
    env:
      # Each hosted job starts cold; keep build output in its own workspace.
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/src-tauri/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux X64
            runner: '["ubuntu-24.04"]'
            shell: bash
            cargo_jobs: 4
          - platform: Windows X64
            runner: '["windows-2022"]'
            shell: pwsh
            cargo_jobs: 2
          # Validate the shipped arm64 target on an arm64 runner.
          - platform: macOS arm64
            runner: '["macos-latest"]'
            shell: bash
            cargo_jobs: 3
    runs-on: ${{ fromJSON(matrix.runner) }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Reclaim disk space for the inference dependencies.
      - name: Free hosted Linux disk space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      # Match windows-installers.yml; long Torch wheel paths need a hosted run.
      - name: Enable Win32 long paths
        if: runner.os == 'Windows'
        run: Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Create isolated Linux Python environment
        if: runner.os == 'Linux'
        run: |
          ROOT="$RUNNER_TEMP/localsr-tauri/verify"
          VENV="$ROOT/venv"
          mkdir -p "$ROOT/tmp"
          export TMPDIR="$ROOT/tmp"
          python -m venv "$VENV"
          echo "LOCALSR_PREVIEW_VENV=$VENV" >> "$GITHUB_ENV"
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Create isolated macOS Python environment
        if: runner.os == 'macOS'
        run: |
          VENV="$RUNNER_TEMP/localsr-tauri/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/verify/venv"
          python3.11 -m venv "$VENV"
          echo "LOCALSR_PREVIEW_VENV=$VENV" >> "$GITHUB_ENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Create isolated Windows Python environment
        if: runner.os == 'Windows'
        run: |
          # Keep this deliberately short: current Torch wheels contain deeply
          # nested license paths that otherwise exceed Win32 MAX_PATH.
          $root = Join-Path $env:RUNNER_TEMP "lsr-verify"
          $venv = Join-Path $root "venv"
          $tmp = Join-Path $root "tmp"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LOCALSR_PREVIEW_VENV=$venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $venv "Scripts") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils xvfb dbus-x11 squashfs-tools
      # Use the same hosted Windows/Rust setup as windows-installers.yml.
      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Initialize the Windows MSVC build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Verify generated model policy
        run: python scripts/export_desktop_catalog.py --check
      - name: Enforce the additive desktop architecture boundary
        run: python scripts/check_desktop_architecture.py
      # One command per step: under pwsh (Windows) only the last command's exit code fails a step.
      - name: Install the Python desktop tooling test dependencies
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1" "pytest-timeout==2.4.0"
      - name: Verify Python desktop tooling and the worker contract
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_desktop_architecture.py tests/test_worker_protocol_contract.py tests/test_tauri_build_script.py tests/test_tauri_installer_smoke.py tests/test_tauri_release_tools.py -q
      - name: Install locked frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Type-check the Svelte interface
        working-directory: desktop
        run: npm run check
      - name: Check for unused frontend code
        working-directory: desktop
        run: npm run knip
      - name: Test the Svelte interface
        working-directory: desktop
        run: npm test
      - name: Build the Svelte interface
        working-directory: desktop
        run: npm run build
      - name: Check Rust formatting
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Lint the native control plane
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test the native control plane
        working-directory: desktop/src-tauri
        run: cargo test --locked --all-targets

  package-preview:
    name: Package private preview (${{ matrix.os }})
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs }}
    if: github.event_name == 'workflow_dispatch' && inputs.build_packages
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: '["ubuntu-24.04"]'
            shell: bash
            cargo_jobs: 4
            bundles: appimage
            package_path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: Windows
            runner: '["windows-2022"]'
            shell: pwsh
            cargo_jobs: 2
            bundles: nsis
            package_path: desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ fromJSON(matrix.runner) }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Reclaim disk space for the inference dependencies.
      - name: Free hosted Linux disk space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      # Match windows-installers.yml; long Torch wheel paths need a hosted run.
      - name: Enable Win32 long paths
        if: runner.os == 'Windows'
        run: Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Create isolated Linux Python environment
        if: runner.os == 'Linux'
        run: |
          ROOT="$RUNNER_TEMP/localsr-tauri/package"
          VENV="$ROOT/venv"
          mkdir -p "$ROOT/tmp"
          export TMPDIR="$ROOT/tmp"
          python -m venv "$VENV"
          echo "LOCALSR_PREVIEW_VENV=$VENV" >> "$GITHUB_ENV"
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Create isolated macOS Python environment
        if: runner.os == 'macOS'
        run: |
          VENV="$RUNNER_TEMP/localsr-tauri/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/package/venv"
          python3.11 -m venv "$VENV"
          echo "LOCALSR_PREVIEW_VENV=$VENV" >> "$GITHUB_ENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Create isolated Windows Python environment
        if: runner.os == 'Windows'
        run: |
          # Keep this deliberately short: current Torch wheels contain deeply
          # nested license paths that otherwise exceed Win32 MAX_PATH.
          $root = Join-Path $env:RUNNER_TEMP "lsr-package"
          $venv = Join-Path $root "venv"
          $tmp = Join-Path $root "tmp"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LOCALSR_PREVIEW_VENV=$venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $venv "Scripts") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils xvfb dbus-x11 squashfs-tools
      # Use the same hosted Windows/Rust setup as windows-installers.yml.
      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Initialize the Windows MSVC build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Install locked frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Install the Linux inference packager
        if: runner.os == 'Linux'
        run: |
          python -m pip install --disable-pip-version-check "pip==${{ env.PIP_VERSION }}"
          python -m pip install --disable-pip-version-check \
            "torch==${{ env.PYTORCH_VERSION }}" "torchvision==${{ env.TORCHVISION_VERSION }}" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            -e ".[package,video,face]" "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
      - name: Install the Windows inference packager
        if: runner.os == 'Windows'
        run: |
          python -m pip install --disable-pip-version-check "pip==${{ env.PIP_VERSION }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check "torch==${{ env.PYTORCH_VERSION }}" "torchvision==${{ env.TORCHVISION_VERSION }}" --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check -e ".[package,video,face]" "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replace PyPI media wheels with the licensing-clean runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y nasm meson ninja-build cmake autoconf automake libtool zlib1g-dev patch
          python packaging/ffmpeg/install_media_runtime.py \
            --work-dir "$RUNNER_TEMP/lgpl-media/linux-x86_64" --jobs 4
      - name: Build the additive desktop package
        # The required verify matrix has already run Svelte checks and tests on
        # this exact commit. Avoid starting a second Vitest worker pool after
        # the memory-intensive PyInstaller build on the hosted runner.
        # This Windows preview uses PyPI media wheels rather than the licensing-clean
        # runtime built by windows-installers.yml; it remains private and unpublished.
        run: python scripts/build_tauri_preview.py --skip-checks --bundles ${{ matrix.bundles }} ${{ runner.os == 'Windows' && '--private-preview-media' || '' }}
      - name: Install or mount the package and boot its bundled worker
        run: python scripts/smoke_tauri_installer.py --artifact-glob "${{ matrix.package_path }}" --report build/tauri-preview/installer-smoke-${{ runner.os }}.json
      - name: Upload optional private acceptance package
        id: upload_package
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LocalSR-Next-Preview-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.package_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Report unavailable private artifact storage
        if: steps.upload_package.outcome == 'failure'
        run: echo "::warning::The installer passed its real launch smoke test, but GitHub Actions artifact storage is currently unavailable or over quota."
