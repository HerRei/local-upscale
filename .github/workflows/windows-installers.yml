name: Windows installers

# Builds the Windows CPU, DirectML and NVIDIA CUDA NSIS installers on GitHub-hosted
# runners with the licensing-clean media runtime: packaging/ffmpeg/build_lgpl_media.py
# builds FFmpeg and its royalty-free codec libraries with MSYS2's UCRT64 toolchain and
# PyAV with MSVC, OpenCV is built without FFmpeg, and build_tauri_preview.py refuses
# anything outside packaging/ffmpeg/codec-policy.json; this workflow never passes
# --private-preview-media. The CUDA engine is too large for one installer, so it ships
# as verified parts that sit next to it, and it must pass the NVIDIA redistribution
# policy. DirectML and CUDA have not been tested on those GPUs (docs/platforms.md).
# Each installer gets its corresponding source bundle. The installers are not
# Authenticode-signed. Every installer carries its update identity (updater public key,
# backend, kind, engine id), so it checks its own feed entry; the installer is its own
# updater file, and its engine package is written next to it. Their signatures are made
# on the Mac (scripts/beta_update_signing.py platforms). Given a release tag, the
# verified installers, engine parts and bundles are attached to it.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release to attach the installers to (empty keeps them as artifacts)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    name: Build Windows x86_64 ${{ matrix.backend }} installer
    # windows-2025 ships only Visual Studio 2026, which scikit-build 0.18 (OpenCV's
    # build) does not recognise; windows-2022 has Visual Studio 2022.
    runs-on: windows-2022
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x86_64-cpu
            backend: CPU
            suffix: Windows-CPU-x86_64.exe
            source: Windows-CPU-source-and-notices.tar.gz
          - id: windows-x86_64-directml
            backend: DirectML
            suffix: Windows-DirectML-x86_64.exe
            source: Windows-DirectML-source-and-notices.tar.gz
          - id: windows-x86_64-cuda
            backend: CUDA
            suffix: Windows-CUDA-x86_64.exe
            source: Windows-CUDA-source-and-notices.tar.gz
    defaults:
      run:
        shell: pwsh
    env:
      PIP_VERSION: "26.2.1"
      LSR: C:\lsr
    steps:
      - name: Enable Win32 long paths
        run: Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: Install the MSYS2 UCRT64 toolchain for the media libraries
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
          C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm --needed make diffutils perl mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-zlib"

      - name: Verify or install NSIS
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) { choco install -y nsis }
          if (Test-Path "C:\Program Files (x86)\NSIS") {
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          }
          makensis.exe /VERSION
          ./scripts/ensure_windows_vc_runtime.ps1

      - name: Create the build environment
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path $env:LSR, "$env:LSR\out" | Out-Null
          python -m venv "$env:LSR\venv"
          "$env:LSR\venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate release identity
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/check_release_version.py
          python scripts/check_desktop_architecture.py
          python scripts/export_desktop_catalog.py --check

      - name: Give the build its update identity
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Compiled into the host: without them it never checks its feed and shows no
          # update switches.
          python scripts/release_targets.py --update-env "${{ matrix.id }}" --commit $env:GITHUB_SHA |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install the locked backend
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check "pip==$env:PIP_VERSION"
          python scripts/backend_wheelhouse.py --target "${{ matrix.id }}" `
            --cache-root "$env:LSR\wheelhouses" --report "$env:LSR\out\dependency-wheelhouse.json"
          python -m pip check
          npm ci --prefix desktop

      - name: Replace PyPI media wheels with the licensing-clean runtime
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python packaging/ffmpeg/install_media_runtime.py --work-dir C:\lm --source-cache C:\lm\sources --jobs 4

      - name: Build, verify and smoke-test the installer
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $name = "LocalSR-v$version-${{ matrix.suffix }}"
          $artifact = Join-Path "$env:LSR\out" $name
          $buildArgs = @('--skip-checks', '--bundles', 'nsis')
          # Hosted runners have no GPU; the installed-package smoke test still probes the backend.
          if ("${{ matrix.backend }}" -eq "DirectML") { $env:LOCALSR_SKIP_DIRECTML_PROBE = "1" }
          if ("${{ matrix.backend }}" -eq "CUDA") {
            $buildArgs += @('--external-engine-prefix', "$([IO.Path]::GetFileNameWithoutExtension($name)).engine.tar.gz")
          }
          python scripts/build_tauri_preview.py @buildArgs
          if ("${{ matrix.backend }}" -eq "CUDA") {
            & build/tauri-preview/worker-dist/engine/localsr-worker.exe --check-cuda-arch
          }
          $bundle = "desktop/src-tauri/target/release/bundle/nsis"
          $sources = @(Get-ChildItem -Path $bundle -Filter '*.exe' -File)
          if ($sources.Count -ne 1) { throw "Expected 1 NSIS installer, found $($sources.Count)" }
          Move-Item -LiteralPath $sources[0].FullName -Destination $artifact
          if ("${{ matrix.backend }}" -eq "CUDA") {
            # The installer finds its engine parts in its own folder.
            Get-ChildItem -LiteralPath build\tauri-preview\engine-payload -Filter '*.part-*' -File |
              Copy-Item -Destination "$env:LSR\out"
          }
          python scripts/verify_codec_allowlist.py --tree build/tauri-preview/worker-dist --output "$artifact.codec-policy.json"
          python scripts/verify_nvidia_redistributables.py build/tauri-preview/worker-dist |
            Out-File -FilePath "$artifact.nvidia.json" -Encoding utf8
          python scripts/smoke_tauri_installer.py --backend "${{ matrix.backend }}" --timeout 1800 `
            --artifact-glob $artifact --report "$artifact.smoke.json" `
            --update-target "${{ matrix.id }}" --commit $env:GITHUB_SHA
          python scripts/verify_tauri_release_package.py $artifact `
            --platform windows --architecture x86_64 --smoke-report "$artifact.smoke.json" `
            --report "$artifact.architecture.json"
          $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Out-File -FilePath "$artifact.sha256" -Encoding ascii
          # The updater's engine package, installed as the versioned engine by an update.
          # CUDA's installer parts already are one; the others package the bundled engine.
          if ("${{ matrix.backend }}" -eq "CUDA") {
            python scripts/prepare_engine_payload.py --target "${{ matrix.id }}" --output "$env:LSR\out" `
              --reuse build\tauri-preview\engine-payload\engine-payload.json
          } else {
            python scripts/prepare_engine_payload.py --target "${{ matrix.id }}" --output "$env:LSR\out" `
              --engine build\tauri-preview\worker-dist\engine
          }
          # Corresponding source for exactly what the installer's engine contains.
          $extra = @(python scripts/fetch_extra_sources.py --platform windows-x86_64 --destination "$env:LSR\extra-sources")
          $sourceName = "LocalSR-v$version-${{ matrix.source }}"
          python scripts/build_source_bundle.py --inventory build/tauri-preview/worker-dist `
            --output "$env:LSR\source" --commit $env:GITHUB_SHA `
            --media-source C:\lm\dist\corresponding-source --opencv-source C:\lm\opencv\corresponding-source `
            @extra | Out-File -FilePath "$env:LSR\out\$sourceName.json" -Encoding utf8
          tar -C $env:LSR -czf "$env:LSR\out\$sourceName" source
          Get-ChildItem "$env:LSR\out"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.id }}
          path: C:\lsr\out\*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: logs-${{ matrix.id }}
          path: |
            C:\lm\work\logs\*
            C:\lm\opencv\build.log
            C:\lm\opencv\build-report.json
          if-no-files-found: ignore
          retention-days: 14

      # The smoke test above runs as the runner's administrator. "Just me" must also install
      # for a standard user without administrator rights, and asking for "Everyone" without
      # them must not install anything into Program Files.
      - name: Install as a standard user without administrator rights
        if: matrix.backend == 'CPU'
        timeout-minutes: 20
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $artifact = Join-Path "$env:LSR\out" "LocalSR-v$version-${{ matrix.suffix }}"
          $user = "lsrstandard"
          # A throwaway credential for this run only, from the system random generator.
          $bytes = New-Object byte[] 24
          [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $secure = ConvertTo-SecureString ([Convert]::ToBase64String($bytes) + "Aa1+") -AsPlainText -Force
          New-LocalUser -Name $user -Password $secure -PasswordNeverExpires | Out-Null
          if ((Get-LocalGroupMember -Group Administrators).Name -match "\\$user$") { throw "$user must not be an administrator" }
          $credential = New-Object System.Management.Automation.PSCredential(".\$user", $secure)
          $probe = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "echo %LOCALAPPDATA%> %TEMP%\lsr-localappdata.txt" `
            -Credential $credential -LoadUserProfile -Wait -PassThru -WorkingDirectory C:\
          $profileRoot = (Get-CimInstance Win32_UserProfile | Where-Object { $_.LocalPath -like "*\$user" }).LocalPath
          if (-not $profileRoot) { throw "The standard user's profile was not created" }
          # Start-Process -Credential hands the child this runner's environment, so Windows
          # cannot resolve the user's AppData there. The installer must then fail, not
          # report a success with nothing installed.
          $broken = Start-Process -FilePath $artifact -ArgumentList "/S" -Credential $credential `
            -LoadUserProfile -Wait -PassThru -WorkingDirectory C:\
          "Install with an unresolved AppData folder exit code: $($broken.ExitCode)"
          if ($broken.ExitCode -eq 0) { throw "The installer reported success without a user folder" }
          if (Test-Path "C:\LocalSR") { throw "The installer wrote to C:\LocalSR" }

          # The real case: the user's own environment, as when they start the installer.
          $userEnv = "set USERPROFILE=$profileRoot&& set LOCALAPPDATA=$profileRoot\AppData\Local&& " +
            "set APPDATA=$profileRoot\AppData\Roaming&& set TEMP=$profileRoot\AppData\Local\Temp&& " +
            "set TMP=$profileRoot\AppData\Local\Temp&& "
          $install = Start-Process -FilePath "cmd.exe" -Credential $credential -LoadUserProfile -Wait -PassThru `
            -WorkingDirectory C:\ -ArgumentList "/c", "$userEnv`"$artifact`" /S"
          "Per-user install exit code: $($install.ExitCode)"
          if ($install.ExitCode -ne 0) { throw "The per-user install failed for a standard user" }
          # Where "Just me" installs is the installer's choice; find the host in that user's AppData.
          $host_exe = Get-ChildItem -LiteralPath (Join-Path $profileRoot "AppData") -Recurse -Depth 5 `
            -Filter "*.exe" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "*localsr*" -and $_.Name -notmatch "^(un|Un)" -and
              $_.FullName -notmatch "\\(engine|resources)\\" } |
            Sort-Object { $_.FullName.Length } | Select-Object -First 1
          if (-not $host_exe) {
            Get-ChildItem -LiteralPath $profileRoot -Recurse -Depth 6 -Filter "*.exe" -File -ErrorAction SilentlyContinue |
              Select-Object -First 30 | ForEach-Object { "found: $($_.FullName)" }
            throw "No LocalSR executable in the standard user's AppData"
          }
          $installDir = $host_exe.DirectoryName
          "Installed for the standard user: $($host_exe.FullName)"
          $machineKey = Get-ChildItem "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
            Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like "LocalSR*" }
          if ($machineKey) { throw "A per-user install wrote a machine-wide uninstall entry" }

          $before = Test-Path "$env:ProgramFiles\LocalSR"
          $all = Start-Process -FilePath "cmd.exe" -Credential $credential -LoadUserProfile -PassThru `
            -WorkingDirectory C:\ -ArgumentList "/c", "$userEnv`"$artifact`" /S /AllUsers"
          if (-not $all.WaitForExit(180000)) {
            Stop-Process -Id $all.Id -Force
            throw "An all-users install without administrator rights did not finish within 3 minutes"
          }
          "All-users install as a standard user exit code: $($all.ExitCode)"
          if (-not $before -and (Test-Path "$env:ProgramFiles\LocalSR")) {
            throw "A standard user installed into Program Files without administrator rights"
          }

          $uninstaller = Get-ChildItem -LiteralPath $installDir -Filter "uninstall*.exe" -File | Select-Object -First 1
          if ($uninstaller) {
            Start-Process -FilePath "cmd.exe" -Credential $credential -LoadUserProfile -Wait -WorkingDirectory C:\ `
              -ArgumentList "/c", "$userEnv`"$($uninstaller.FullName)`" /S _?=$installDir" | Out-Null
          }

          # With an all-users install present, a standard user's silent run must fail instead
          # of adding a second per-user copy, and a silent uninstall of it must fail too.
          $machine = Start-Process -FilePath $artifact -ArgumentList "/S", "/AllUsers" -Wait -PassThru
          if ($machine.ExitCode -ne 0) { throw "The administrator's all-users install failed: $($machine.ExitCode)" }
          $machineDir = Join-Path $env:ProgramFiles "LocalSR"
          $machineUninstaller = Join-Path $machineDir "uninstall.exe"
          if (-not (Test-Path -LiteralPath $machineUninstaller)) { throw "No all-users install in $machineDir" }
          $over = Start-Process -FilePath "cmd.exe" -Credential $credential -LoadUserProfile -PassThru `
            -WorkingDirectory C:\ -ArgumentList "/c", "$userEnv`"$artifact`" /S"
          if (-not $over.WaitForExit(180000)) {
            Stop-Process -Id $over.Id -Force
            throw "A silent run over an all-users install did not finish within 3 minutes"
          }
          "Standard user's silent run over the all-users install exit code: $($over.ExitCode)"
          if ($over.ExitCode -eq 0) { throw "A standard user's silent run over an all-users install reported success" }
          if (Test-Path -LiteralPath (Join-Path $profileRoot "AppData\Local\LocalSR")) {
            throw "A silent run over an all-users install added a per-user copy"
          }
          $remove = Start-Process -FilePath "cmd.exe" -Credential $credential -LoadUserProfile -Wait -PassThru `
            -WorkingDirectory C:\ -ArgumentList "/c", "$userEnv`"$machineUninstaller`" /S _?=$machineDir"
          "Standard user's silent uninstall of the all-users install exit code: $($remove.ExitCode)"
          if ($remove.ExitCode -eq 0) { throw "A standard user's silent uninstall of an all-users install reported success" }
          if (-not (Test-Path -LiteralPath $machineUninstaller)) { throw "A standard user removed files of the all-users install" }
          $cleanup = Start-Process -FilePath $machineUninstaller -ArgumentList "/S", "_?=$machineDir" -Wait -PassThru
          "Administrator uninstall exit code: $($cleanup.ExitCode)"
          if ($cleanup.ExitCode -ne 0) { throw "The administrator could not uninstall the all-users install" }
          Remove-LocalUser -Name $user

  attach:
    name: Attach verified installers to the release
    needs: installer
    if: ${{ !cancelled() && inputs.release_tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: assets
          pattern: windows-x86_64-*
          merge-multiple: true
      - name: Upload the installers and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          shopt -s nullglob
          files=()
          for installer in assets/*.exe; do
            # Attach only installers whose own checksum and smoke report exist.
            if [ -f "$installer.sha256" ] && [ -f "$installer.smoke.json" ]; then
              files+=("$installer" "$installer.sha256")
            fi
          done
          files+=(assets/*.engine.tar.gz.part-* assets/*.engine-payload.json \
            assets/*-source-and-notices.tar.gz)
          test "${#files[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
