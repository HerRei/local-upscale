# Test only (throwaway branch): the Windows updater end to end on a hosted runner.
name: Update E2E Windows
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  e2e:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download the v1 and v2 installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42677928027 --repo ${{ github.repository }} -n windows-x86_64-cpu -D C:\e2e\art1
          gh run download 42677934805 --repo ${{ github.repository }} -n windows-x86_64-cpu -D C:\e2e\art2
          Get-ChildItem C:\e2e\art1,C:\e2e\art2 -Filter *.exe | Select-Object FullName,Length
      - name: Run the scenarios
        run: ./test-e2e/run.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: update-e2e-logs
          path: C:\e2e\out\*
          if-no-files-found: warn
