name: Signed Tauri Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localsr-macmini-heavy
  cancel-in-progress: false

env:
  CI_ARTIFACT_SERVER: "http://192.168.9.134:8000"
  PIP_VERSION: "26.2.1"
  PYTORCH_VERSION: "2.13.0"
  TORCHVISION_VERSION: "0.28.0"
  PYINSTALLER_VERSION: "6.22.2"

jobs:
  plan:
    name: Validate the complete release target registry
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.targets.outputs.linux }}
      windows: ${{ steps.targets.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate and expand the complete target registry
        id: targets
        run: |
          python3 scripts/check_release_version.py
          python3 scripts/release_targets.py --github-output "$GITHUB_OUTPUT"

  preflight:
    name: Preflight signed ${{ matrix.platform }} runner
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: '["self-hosted","Linux","X64","localsr-linux-builder"]'
          - platform: windows
            runner: '["self-hosted","Windows","X64","localsr-windows-builder"]'
          - platform: macos
            # Hosted Apple Silicon is genuinely arm64, so the architecture gate
            # in the build job now passes instead of failing closed. This also
            # frees the Mac mini's Intel macOS guest, which could never have
            # satisfied that gate.
            runner: '["macos-latest"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify Linux release prerequisites
        if: runner.os == 'Linux'
        run: python3 scripts/release_runner_preflight.py --server "$CI_ARTIFACT_SERVER" --platform linux --scratch-path /ci-scratch --scratch-min-free-gib 15 --require-tool python3 --require-tool curl --require-tool git
      - name: Verify Windows release prerequisites
        if: runner.os == 'Windows'
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          ./scripts/ensure_windows_vc_runtime.ps1
          ./scripts/ensure_windows_scratch.ps1 -MinimumFreeGiB 20
          py -3.11 scripts/release_runner_preflight.py --server $env:CI_ARTIFACT_SERVER --platform windows --scratch-path C:\ --scratch-min-free-gib 20 --require-tool py --require-tool git
      - name: Verify native Apple-Silicon release prerequisites
        if: runner.os == 'macOS'
        run: |
          if [[ "$(uname -m)" != arm64 ]]; then
            echo "::error::A registered native macOS ARM64 runner is required for signed releases."
            exit 1
          fi
          # The hosted runner cannot reach the LAN artifact receiver, and its
          # workspace is ephemeral, so only the toolchain check applies here.
          python3 scripts/release_runner_preflight.py \
            --platform macos --scratch-path "$RUNNER_TEMP" --scratch-min-free-gib 10 \
            --require-tool python3 --require-tool git --require-tool codesign --require-tool xcrun

  build-linux:
    name: Build Linux x86_64 ${{ matrix.backend }} AppImage
    needs: [preflight, plan]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}
    runs-on: [self-hosted, Linux, X64, localsr-linux-builder]
    timeout-minutes: 240
    env:
      PIP_CACHE_DIR: /ci-scratch/cache/pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Revalidate release runner immediately before build
        run: python3 scripts/release_runner_preflight.py --server "$CI_ARTIFACT_SERVER" --platform linux --scratch-path /ci-scratch --scratch-min-free-gib 15 --require-tool python3 --require-tool curl --require-tool git
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Expose the persistent Rust toolchain
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Allocate bounded SSD working storage
        run: |
          python3 scripts/release_scratch.py init --root /ci-scratch
          python3 scripts/release_scratch.py cleanup --root /ci-scratch
          ROOT=$(python3 scripts/release_scratch.py start --root /ci-scratch \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --platform linux --flavor signed-tauri-${{ matrix.id }})
          mkdir -p /ci-scratch/cache/pip
          python3 scripts/storage_preflight.py --ssd-path /ci-scratch --skip-hdd --ssd-min-percent 15 --ssd-peak-gib "${{ matrix.scratch_peak_gib }}"
          "$HOME/.venv-ci/bin/python3.11" -m venv "$ROOT/venv"
          {
            echo "LOCALSR_TAURI_ROOT=$ROOT"
            echo "TMPDIR=$ROOT/tmp"
            echo "CARGO_TARGET_DIR=/ci-scratch/cargo-target/tauri-x86_64"
          } >> "$GITHUB_ENV"
          echo "$ROOT/venv/bin" >> "$GITHUB_PATH"
      - name: Validate release identity and architecture
        run: |
          TAG_ARGUMENTS=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG_ARGUMENTS=(--tag "$GITHUB_REF_NAME"); fi
          python scripts/check_release_version.py "${TAG_ARGUMENTS[@]}"
          python scripts/check_desktop_architecture.py
          python scripts/export_desktop_catalog.py --check
      - name: Install native packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils xvfb dbus-x11 librdmacm1 libibverbs1
          python -m pip install --disable-pip-version-check "pip==${PIP_VERSION}"
          python scripts/backend_wheelhouse.py --target "${{ matrix.id }}" \
            --cache-root /ci-scratch/wheelhouses --report "$LOCALSR_TAURI_ROOT/staging/dependency-wheelhouse.json"
          python -m pip check
          python -c "import diffusers; from packaging.version import Version; assert Version(diffusers.__version__) >= Version('0.38.0')"
          npm ci --prefix desktop
      - name: Replace PyPI media wheels with the licensing-clean runtime
        run: |
          sudo apt-get install -y nasm meson ninja-build cmake autoconf automake libtool zlib1g-dev patch
          python packaging/ffmpeg/install_media_runtime.py \
            --work-dir /ci-scratch/lgpl-media/linux-x86_64 --source-cache /ci-scratch/lgpl-media/sources --jobs 8
      - name: Download and run the actual Quick and Best models from an empty cache
        run: |
          LIVE_MODEL_CACHE="$LOCALSR_TAURI_ROOT/live-model-cache"
          mkdir -p "$LIVE_MODEL_CACHE"
          test -z "$(find "$LIVE_MODEL_CACHE" -mindepth 1 -maxdepth 1 -print -quit)"
          python scripts/validate_live_models.py \
            --cache "$LIVE_MODEL_CACHE" \
            --report "$LOCALSR_TAURI_ROOT/staging/live-models.json"
      - name: Build and smoke-test the installed AppImage
        run: |
          python scripts/build_tauri_preview.py --skip-checks --require-signing --bundles appimage
          SOURCE=$(find "$CARGO_TARGET_DIR/release/bundle/appimage" -maxdepth 1 -type f -name '*.AppImage')
          test "$(printf '%s\n' "$SOURCE" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          ARTIFACT="$LOCALSR_TAURI_ROOT/staging/${{ matrix.pkg_name }}"
          cp "$SOURCE" "$ARTIFACT"
          chmod +x "$ARTIFACT"
          python scripts/smoke_tauri_installer.py --backend "${{ matrix.backend }}" --timeout 900 \
            --artifact-glob "$ARTIFACT" \
            --report "$LOCALSR_TAURI_ROOT/staging/package-smoke.json"
          python scripts/verify_tauri_release_package.py "$ARTIFACT" \
            --platform linux --architecture x86_64 \
            --report "$ARTIFACT.architecture.json"
          python -c 'import json,sys; open(sys.argv[1],"w").write(json.dumps({"status":"sha256"},indent=2)+"\n")' \
            "$LOCALSR_TAURI_ROOT/staging/signing-report.json"
          python scripts/write_artifact_metadata.py "$ARTIFACT" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --platform linux --architecture x86_64 --backend "${{ matrix.backend }}" \
            --smoke-report "$LOCALSR_TAURI_ROOT/staging/package-smoke.json" \
            --signing-report "$LOCALSR_TAURI_ROOT/staging/signing-report.json" \
            --dependency-report "$LOCALSR_TAURI_ROOT/staging/dependency-wheelhouse.json" \
            --live-model-report "$LOCALSR_TAURI_ROOT/staging/live-models.json"
      - name: Transfer only verified release inputs
        env:
          CI_ARTIFACT_TOKEN: ${{ secrets.CI_ARTIFACT_TOKEN }}
        run: |
          ARTIFACT="$LOCALSR_TAURI_ROOT/staging/${{ matrix.pkg_name }}"
          python scripts/upload_artifacts.py --server "$CI_ARTIFACT_SERVER" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --platform linux \
            "$ARTIFACT" "$ARTIFACT.sha256" "$ARTIFACT.metadata.json" "$ARTIFACT.architecture.json"
      - name: Finalize bounded Linux scratch
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -n "${LOCALSR_TAURI_ROOT:-}" && -f "$LOCALSR_TAURI_ROOT/.localsr-release-run.json" ]]; then
            python3 scripts/release_scratch.py finish --root /ci-scratch \
              --target "$LOCALSR_TAURI_ROOT" --status "$JOB_STATUS" --retain-hours 48
          fi

  build-windows:
    name: Build signed Windows x86_64 ${{ matrix.backend }} installer
    needs: [build-linux, plan]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.windows) }}
    runs-on: [self-hosted, Windows, X64, localsr-windows-builder]
    timeout-minutes: 240
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Stop until the Windows licensing-clean media runtime exists
        run: |
          Write-Output "::error::Windows packages are blocked: packaging/ffmpeg/build_lgpl_media.py cannot build the LGPL media runtime on Windows yet, and cuDNN 9 Windows DLL redistribution is unconfirmed. See docs/licensing-media.md."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Revalidate release runner immediately before build
        run: |
          ./scripts/ensure_windows_vc_runtime.ps1
          ./scripts/ensure_windows_scratch.ps1 -MinimumFreeGiB 20
          py -3.11 scripts/release_runner_preflight.py --server $env:CI_ARTIFACT_SERVER --platform windows --scratch-path C:\ --scratch-min-free-gib 20 --require-tool py --require-tool git
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install stable Rust and initialize MSVC
        run: ./scripts/install_windows_rust.ps1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Allocate bounded Windows working storage
        run: |
          py -3.11 scripts/release_scratch.py init --root C:\lsr-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3.11 scripts/release_scratch.py cleanup --root C:\lsr-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3.11 scripts/storage_preflight.py --ssd-path C:\lsr-ci --skip-hdd --ssd-min-percent 15 --ssd-peak-gib "${{ matrix.scratch_peak_gib }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = "C:\lsr-ci\runs\$env:GITHUB_RUN_ID\$env:GITHUB_RUN_ATTEMPT\windows\signed-tauri-${{ matrix.id }}"
          py -3.11 scripts/release_scratch.py start --root C:\lsr-ci --run-id $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT --platform windows --flavor signed-tauri-${{ matrix.id }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $venv = Join-Path $root "venv"
          $tmp = Join-Path $root "tmp"
          New-Item -ItemType Directory -Force -Path $tmp, (Join-Path $root "staging") | Out-Null
          py -3.11 -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LOCALSR_TAURI_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$tmp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$tmp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=C:\lsr-ci\cargo-target\tauri-x86_64" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $venv "Scripts") | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Import the release Authenticode certificate
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          foreach ($name in 'WINDOWS_CERTIFICATE_PFX_BASE64','WINDOWS_CERTIFICATE_PASSWORD','WINDOWS_CERTIFICATE_THUMBPRINT','WINDOWS_TIMESTAMP_URL') {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) { throw "Missing required signing secret: $name" }
          }
          $pfx = Join-Path $env:LOCALSR_TAURI_ROOT "release-certificate.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($null -eq $certificate) { throw "The Authenticode certificate could not be imported" }
          # Persist the imported identity before any later validation can fail,
          # so the always() step removes it even on a thumbprint mismatch.
          "LOCALSR_IMPORTED_CERTIFICATE=$($certificate.Thumbprint)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $wantedThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT.Replace(' ','').ToUpperInvariant()
          if ($certificate.Thumbprint.ToUpperInvariant() -ne $wantedThumbprint) { throw "Imported certificate thumbprint mismatch" }
      - name: Install the maintained worker toolchain
        run: |
          python -m pip install --disable-pip-version-check "pip==$env:PIP_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/backend_wheelhouse.py --target "${{ matrix.id }}" --cache-root C:\lsr-ci\wheelhouses --report (Join-Path $env:LOCALSR_TAURI_ROOT 'staging\dependency-wheelhouse.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import diffusers; from packaging.version import Version; assert Version(diffusers.__version__) >= Version('0.38.0')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, sign, and smoke-test the installed NSIS package
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ("${{ matrix.backend }}" -eq "DirectML") {
            $env:LOCALSR_SKIP_DIRECTML_PROBE = "1"
          }
          $buildArgs = @('--skip-checks', '--bundles', 'nsis')
          $payloadArgs = @()
          if ("${{ matrix.backend }}" -eq "DirectML") { $env:LOCALSR_SKIP_DIRECTML_PROBE = "1" }
          if ("${{ matrix.backend }}" -eq "CUDA") {
            $buildArgs += @('--external-engine-prefix', ([IO.Path]::GetFileNameWithoutExtension("${{ matrix.pkg_name }}") + '.engine.tar.gz'))
          }
          $buildArgs += '--require-signing'
          python scripts/build_tauri_preview.py @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sources = @(Get-ChildItem -Path (Join-Path $env:CARGO_TARGET_DIR 'release\bundle\nsis') -Filter '*.exe' -File)
          if ($sources.Count -ne 1) { throw "Expected one NSIS installer, found $($sources.Count)" }
          $artifact = Join-Path $env:LOCALSR_TAURI_ROOT 'staging\${{ matrix.pkg_name }}'
          Copy-Item -LiteralPath $sources[0].FullName -Destination $artifact
          if ("${{ matrix.backend }}" -eq "CUDA") {
            $payloadRoot = Join-Path $env:GITHUB_WORKSPACE 'build\tauri-preview\engine-payload'
            Get-ChildItem -LiteralPath $payloadRoot -Filter '*.part-*' -File | Copy-Item -Destination (Join-Path $env:LOCALSR_TAURI_ROOT 'staging')
            $payloadArgs = @('--engine-payload-manifest', (Join-Path $payloadRoot 'engine-payload.json'))
          }
          python scripts/smoke_tauri_installer.py --backend "${{ matrix.backend }}" --timeout 1800 --artifact-glob $artifact --report (Join-Path $env:LOCALSR_TAURI_ROOT 'staging\package-smoke.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_tauri_release_package.py $artifact --platform windows --architecture x86_64 --smoke-report (Join-Path $env:LOCALSR_TAURI_ROOT 'staging\package-smoke.json') --report "$artifact.architecture.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/verify_windows_tauri_signing.ps1 -Artifact $artifact -ExpectedThumbprint $env:WINDOWS_CERTIFICATE_THUMBPRINT -Report (Join-Path $env:LOCALSR_TAURI_ROOT 'staging\signing-report.json')
          python scripts/write_artifact_metadata.py $artifact @payloadArgs --dependency-report (Join-Path $env:LOCALSR_TAURI_ROOT 'staging\dependency-wheelhouse.json') --commit $env:GITHUB_SHA --run-id $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT --platform windows --architecture x86_64 --backend "${{ matrix.backend }}" --smoke-report (Join-Path $env:LOCALSR_TAURI_ROOT 'staging\package-smoke.json') --signing-report (Join-Path $env:LOCALSR_TAURI_ROOT 'staging\signing-report.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Transfer only verified release inputs
        env:
          CI_ARTIFACT_TOKEN: ${{ secrets.CI_ARTIFACT_TOKEN }}
        run: |
          $payloadFiles = @(Get-ChildItem -Path (Join-Path $env:LOCALSR_TAURI_ROOT 'staging') -Filter '*.part-*' -File | ForEach-Object { $_.FullName })
          $artifact = Join-Path $env:LOCALSR_TAURI_ROOT 'staging\${{ matrix.pkg_name }}'
          python scripts/upload_artifacts.py @payloadFiles --server $env:CI_ARTIFACT_SERVER --run-id $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT --platform windows $artifact "$artifact.sha256" "$artifact.metadata.json" "$artifact.architecture.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove the imported certificate and bounded scratch
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if ($env:LOCALSR_IMPORTED_CERTIFICATE) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:LOCALSR_IMPORTED_CERTIFICATE" -Force -ErrorAction SilentlyContinue
          }
          if ($env:LOCALSR_TAURI_ROOT -and (Test-Path -LiteralPath (Join-Path $env:LOCALSR_TAURI_ROOT '.localsr-release-run.json'))) {
            py -3.11 scripts/release_scratch.py finish --root C:\lsr-ci --target $env:LOCALSR_TAURI_ROOT --status $env:JOB_STATUS --retain-hours 48 --secret release-certificate.pfx
          }

  build-macos-arm64:
    name: Build signed and notarized macOS ARM64 DMG
    needs: [build-windows]
    # Hosted Apple Silicon. The architecture gate below now passes on a genuine
    # arm64 host instead of failing closed on the Intel Mac-mini guest, which
    # could never satisfy it.
    runs-on: macos-latest
    timeout-minutes: 300
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Revalidate release runner immediately before build
        run: |
          if [[ "$(uname -m)" != arm64 ]]; then
            echo "::error::A registered native macOS ARM64 runner is required for signed releases."
            exit 1
          fi
          # No --server: the hosted runner cannot reach the LAN receiver, so
          # only the runner-side toolchain and space checks apply.
          python3 scripts/release_runner_preflight.py \
            --platform macos --scratch-path "$RUNNER_TEMP" --scratch-min-free-gib 10 \
            --require-tool python3 --require-tool git --require-tool codesign --require-tool xcrun
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Expose the persistent Rust toolchain
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Require a genuinely native Apple Silicon runner
        run: |
          if [[ "$(uname -m)" != arm64 ]]; then
            echo "::error::A registered native macOS ARM64 runner is required for signed releases."
            exit 1
          fi
          python3 -c 'import platform; assert platform.machine() == "arm64", platform.machine()'
      # The hosted image has no python.org framework build at a fixed path.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Allocate working storage
        run: |
          # A hosted runner is ephemeral and its disk is discarded with the job,
          # so the guest-SSD scratch bookkeeping this job used to do is replaced
          # by a plain directory under RUNNER_TEMP.
          ROOT="$RUNNER_TEMP/localsr-release/signed-arm64"
          mkdir -p "$ROOT/tmp" "$ROOT/staging"
          python3.11 -m venv "$ROOT/venv"
          {
            echo "LOCALSR_TAURI_ROOT=$ROOT"
            echo "TMPDIR=$ROOT/tmp"
            echo "CARGO_TARGET_DIR=$ROOT/cargo-target"
          } >> "$GITHUB_ENV"
          echo "$ROOT/venv/bin" >> "$GITHUB_PATH"
      - name: Install the maintained native ARM worker toolchain
        run: |
          python -c 'import platform; assert platform.machine() == "arm64"'
          python -m pip install --disable-pip-version-check "pip==${PIP_VERSION}"
          python -m pip install --disable-pip-version-check \
            "torch==${PYTORCH_VERSION}" "torchvision==${TORCHVISION_VERSION}"
          python -m pip install --disable-pip-version-check \
            -e ".[package,video,face]" "pyinstaller==${PYINSTALLER_VERSION}"
          python -m pip check
          python -c "import diffusers,platform,torch; from packaging.version import Version; assert platform.machine()=='arm64'; assert Version(diffusers.__version__) >= Version('0.38.0'); assert torch.__version__.startswith('2.13.')"
          npm ci --prefix desktop
      - name: Replace PyPI media wheels with the licensing-clean runtime
        run: |
          for tool in nasm meson ninja cmake autoconf automake; do
            command -v "$tool" >/dev/null || brew install "$tool"
          done
          # The source cache no longer survives between runs now that this job
          # is ephemeral, so the LGPL media runtime is rebuilt each release.
          python packaging/ffmpeg/install_media_runtime.py \
            --work-dir "$RUNNER_TEMP/lgpl-media/macos-arm64" \
            --source-cache "$RUNNER_TEMP/lgpl-media/sources" --jobs 3
      - name: Build, sign, notarize, staple, and smoke-test the DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "Missing required signing secret: $name" >&2; exit 1; }
          done
          python scripts/build_tauri_preview.py --skip-checks --require-signing --bundles dmg
          SOURCE=$(find "$CARGO_TARGET_DIR/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg')
          test "$(printf '%s\n' "$SOURCE" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          ARTIFACT="$LOCALSR_TAURI_ROOT/staging/LocalSR-v${VERSION}-macOS-arm64.dmg"
          cp "$SOURCE" "$ARTIFACT"
          python scripts/smoke_tauri_installer.py --backend MPS --artifact-glob "$ARTIFACT" \
            --report "$LOCALSR_TAURI_ROOT/staging/package-smoke.json"
          python scripts/verify_tauri_release_package.py "$ARTIFACT" \
            --platform macos --architecture arm64 --report "$ARTIFACT.architecture.json"
          python scripts/verify_macos_tauri_signing.py "$ARTIFACT" \
            --team-id "$APPLE_TEAM_ID" --report "$LOCALSR_TAURI_ROOT/staging/signing-report.json"
          python scripts/write_artifact_metadata.py "$ARTIFACT" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --platform macos --architecture arm64 --backend MPS \
            --smoke-report "$LOCALSR_TAURI_ROOT/staging/package-smoke.json" \
            --signing-report "$LOCALSR_TAURI_ROOT/staging/signing-report.json"
      # The LAN artifact receiver is unreachable from a hosted runner, so the
      # verified inputs travel through GitHub instead. publish-release unpacks
      # them into the same ci-artifacts layout the receiver would have written.
      - name: Collect verified release inputs
        id: collect
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          ARTIFACT="$LOCALSR_TAURI_ROOT/staging/LocalSR-v${VERSION}-macOS-arm64.dmg"
          OUT="$RUNNER_TEMP/macos-release-inputs"
          mkdir -p "$OUT"
          for suffix in "" .sha256 .metadata.json .architecture.json; do
            test -f "$ARTIFACT$suffix"
            cp "$ARTIFACT$suffix" "$OUT/"
          done
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-release-inputs
          path: ${{ steps.collect.outputs.dir }}
          if-no-files-found: error
          retention-days: 7

  verify-release-matrix:
    name: Verify complete signed release matrix
    needs: [build-macos-arm64]
    runs-on: [self-hosted, Linux, X64, localsr-linux-builder]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify all package and private evidence before publication
        run: |
          RUN_ROOT="/mnt/hdd/ci-artifacts/$GITHUB_RUN_ID"
          OUTPUT="$RUN_ROOT/$GITHUB_RUN_ATTEMPT/tauri-signed-rehearsal"
          VERSION=$("$HOME/.venv-ci/bin/python3.11" -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME:-v$VERSION}"
          if [[ "$TAG" != v* ]]; then TAG="v$VERSION"; fi
          "$HOME/.venv-ci/bin/python3.11" scripts/prepare_tauri_release_assets.py "$RUN_ROOT" \
            --manifest ci/tauri-release-artifacts.json --readiness ci/beta-readiness.json \
            --tag "$TAG" --commit "$GITHUB_SHA" --output "$OUTPUT" --verification-only
          "$HOME/.venv-ci/bin/python3.11" scripts/verify_prepared_release.py "$OUTPUT" \
            --manifest ci/tauri-release-artifacts.json --commit "$GITHUB_SHA"

  publish-release:
    name: Publish compact immutable prerelease
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify-release-matrix]
    runs-on: [self-hosted, Linux, X64, localsr-linux-builder]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # macOS now builds on a hosted runner that cannot POST to the LAN
      # receiver, so its outputs arrive through GitHub and are placed into the
      # exact ci-artifacts path the receiver would have written for them.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: macos-release-inputs
          path: /mnt/hdd/ci-artifacts/${{ github.run_id }}/${{ github.run_attempt }}/macos
      - name: Prepare all verified backend downloads
        run: |
          RUN_ROOT="/mnt/hdd/ci-artifacts/$GITHUB_RUN_ID"
          OUTPUT="$RUN_ROOT/$GITHUB_RUN_ATTEMPT/tauri-release-assets"
          "$HOME/.venv-ci/bin/python3.11" scripts/prepare_tauri_release_assets.py "$RUN_ROOT" \
            --manifest ci/tauri-release-artifacts.json --readiness ci/beta-readiness.json \
            --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --output "$OUTPUT"
          echo "LOCALSR_RELEASE_OUTPUT=$OUTPUT" >> "$GITHUB_ENV"
      - name: Create or resume, verify, and publish an immutable prerelease
        run: |
          TAG="$GITHUB_REF_NAME"
          TITLE="LocalSR $TAG"
          NOTES_FILE="docs/releases/$TAG.md"
          test -f "$NOTES_FILE"
          "$HOME/.venv-ci/bin/python3.11" scripts/publish_tauri_release.py \
            --tag "$TAG" --commit "$GITHUB_SHA" --title "$TITLE" \
            --notes "$NOTES_FILE" --output "$LOCALSR_RELEASE_OUTPUT"
