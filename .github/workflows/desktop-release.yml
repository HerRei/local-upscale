name: Signed Tauri Alpha Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localsr-signed-desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI_ARTIFACT_SERVER: "http://192.168.9.134:8000"
  PIP_VERSION: "26.2.1"
  PYTORCH_VERSION: "2.13.0"
  TORCHVISION_VERSION: "0.28.0"
  PYINSTALLER_VERSION: "6.22.2"

jobs:
  build-linux:
    name: Build Linux x86_64 AppImage
    if: github.ref_name != 'v0.0.10-alpha'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240
    env:
      PIP_CACHE_DIR: /ci-scratch/cache/pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Allocate bounded SSD working storage
        run: |
          ROOT="/ci-scratch/localsr-tauri-release/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/linux"
          mkdir -p "$ROOT/tmp" "$ROOT/staging" /ci-scratch/cache/pip
          python3 scripts/storage_preflight.py --ssd-path /ci-scratch --skip-hdd --ssd-peak-gib 8
          python3.11 -m venv "$ROOT/venv"
          {
            echo "LOCALSR_TAURI_ROOT=$ROOT"
            echo "TMPDIR=$ROOT/tmp"
            echo "CARGO_TARGET_DIR=$ROOT/cargo-target"
          } >> "$GITHUB_ENV"
          echo "$ROOT/venv/bin" >> "$GITHUB_PATH"
      - name: Validate release identity and architecture
        run: |
          TAG_ARGUMENTS=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG_ARGUMENTS=(--tag "$GITHUB_REF_NAME"); fi
          python scripts/check_release_version.py "${TAG_ARGUMENTS[@]}"
          python scripts/check_desktop_architecture.py
          python scripts/export_desktop_catalog.py --check
      - name: Install native packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils xvfb dbus-x11
          python -m pip install --disable-pip-version-check "pip==${PIP_VERSION}"
          python -m pip install --disable-pip-version-check \
            "torch==${PYTORCH_VERSION}" "torchvision==${TORCHVISION_VERSION}" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            -e ".[package,video]" "pyinstaller==${PYINSTALLER_VERSION}"
          python -m pip check
          python -c 'import diffusers,torch; from packaging.version import Version; assert Version(diffusers.__version__) >= Version("0.38.0"); assert torch.__version__.startswith("2.13.")'
          npm ci --prefix desktop
      - name: Download and run the actual Quick and Best models from an empty cache
        run: |
          LIVE_MODEL_CACHE="$LOCALSR_TAURI_ROOT/live-model-cache"
          mkdir -p "$LIVE_MODEL_CACHE"
          test -z "$(find "$LIVE_MODEL_CACHE" -mindepth 1 -maxdepth 1 -print -quit)"
          python scripts/validate_live_models.py \
            --cache "$LIVE_MODEL_CACHE" \
            --report "$LOCALSR_TAURI_ROOT/staging/live-models.json"
      - name: Build and smoke-test the installed AppImage
        run: |
          python scripts/build_tauri_preview.py --skip-checks --require-signing --bundles appimage
          SOURCE=$(find "$CARGO_TARGET_DIR/release/bundle/appimage" -maxdepth 1 -type f -name '*.AppImage')
          test "$(printf '%s\n' "$SOURCE" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          ARTIFACT="$LOCALSR_TAURI_ROOT/staging/LocalSR-v0.0.10-alpha-Linux-x86_64.AppImage"
          cp "$SOURCE" "$ARTIFACT"
          chmod +x "$ARTIFACT"
          python scripts/smoke_tauri_installer.py \
            --artifact-glob "$ARTIFACT" \
            --report "$LOCALSR_TAURI_ROOT/staging/package-smoke.json"
          python scripts/verify_tauri_release_package.py "$ARTIFACT" \
            --platform linux --architecture x86_64 \
            --report "$ARTIFACT.architecture.json"
          python -c 'import json,sys; open(sys.argv[1],"w").write(json.dumps({"status":"sha256"},indent=2)+"\n")' \
            "$LOCALSR_TAURI_ROOT/staging/signing-report.json"
          python scripts/write_artifact_metadata.py "$ARTIFACT" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --platform linux --architecture x86_64 --backend CPU \
            --smoke-report "$LOCALSR_TAURI_ROOT/staging/package-smoke.json" \
            --signing-report "$LOCALSR_TAURI_ROOT/staging/signing-report.json" \
            --live-model-report "$LOCALSR_TAURI_ROOT/staging/live-models.json"
      - name: Transfer only verified release inputs
        env:
          CI_ARTIFACT_TOKEN: ${{ secrets.CI_ARTIFACT_TOKEN }}
        run: |
          ARTIFACT="$LOCALSR_TAURI_ROOT/staging/LocalSR-v0.0.10-alpha-Linux-x86_64.AppImage"
          python scripts/upload_artifacts.py --server "$CI_ARTIFACT_SERVER" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --platform tauri-linux \
            "$ARTIFACT" "$ARTIFACT.sha256" "$ARTIFACT.metadata.json" "$ARTIFACT.architecture.json"
      - name: Remove bounded Linux scratch
        if: always()
        run: |
          if [[ "${LOCALSR_TAURI_ROOT:-}" == /ci-scratch/localsr-tauri-release/*/linux ]]; then
            rm -rf -- "$LOCALSR_TAURI_ROOT"
          fi

  build-windows:
    name: Build signed Windows x86_64 installer
    if: github.ref_name != 'v0.0.10-alpha'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install stable Rust and initialize MSVC
        run: ./scripts/install_windows_rust.ps1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Allocate bounded Windows working storage
        run: |
          $root = "C:\lsr-ci\$env:GITHUB_RUN_ID\$env:GITHUB_RUN_ATTEMPT\tauri-release"
          $venv = Join-Path $root "venv"
          $tmp = Join-Path $root "tmp"
          New-Item -ItemType Directory -Force -Path $tmp, (Join-Path $root "staging") | Out-Null
          py -3.11 -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LOCALSR_TAURI_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$tmp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$tmp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$(Join-Path $root 'cargo-target')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $venv "Scripts") | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Import the release Authenticode certificate
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          foreach ($name in 'WINDOWS_CERTIFICATE_PFX_BASE64','WINDOWS_CERTIFICATE_PASSWORD','WINDOWS_CERTIFICATE_THUMBPRINT','WINDOWS_TIMESTAMP_URL') {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) { throw "Missing required signing secret: $name" }
          }
          $pfx = Join-Path $env:LOCALSR_TAURI_ROOT "release-certificate.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($null -eq $certificate) { throw "The Authenticode certificate could not be imported" }
          $wantedThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT.Replace(' ','').ToUpperInvariant()
          if ($certificate.Thumbprint.ToUpperInvariant() -ne $wantedThumbprint) { throw "Imported certificate thumbprint mismatch" }
          "LOCALSR_IMPORTED_CERTIFICATE=$($certificate.Thumbprint)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install the maintained CPU worker toolchain
        run: |
          python -m pip install --disable-pip-version-check "pip==$env:PIP_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check "torch==$env:PYTORCH_VERSION" "torchvision==$env:TORCHVISION_VERSION" --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check -e ".[package,video]" "pyinstaller==$env:PYINSTALLER_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c 'import diffusers,torch; from packaging.version import Version; assert Version(diffusers.__version__) >= Version("0.38.0"); assert torch.__version__.startswith("2.13.")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, sign, and smoke-test the installed NSIS package
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          python scripts/build_tauri_preview.py --skip-checks --require-signing --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sources = @(Get-ChildItem -Path (Join-Path $env:CARGO_TARGET_DIR 'release\bundle\nsis') -Filter '*.exe' -File)
          if ($sources.Count -ne 1) { throw "Expected one NSIS installer, found $($sources.Count)" }
          $artifact = Join-Path $env:LOCALSR_TAURI_ROOT 'staging\LocalSR-v0.0.10-alpha-Windows-x86_64.exe'
          Copy-Item -LiteralPath $sources[0].FullName -Destination $artifact
          python scripts/smoke_tauri_installer.py --artifact-glob $artifact --report (Join-Path $env:LOCALSR_TAURI_ROOT 'staging\package-smoke.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_tauri_release_package.py $artifact --platform windows --architecture x86_64 --report "$artifact.architecture.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/verify_windows_tauri_signing.ps1 -Artifact $artifact -ExpectedThumbprint $env:WINDOWS_CERTIFICATE_THUMBPRINT -Report (Join-Path $env:LOCALSR_TAURI_ROOT 'staging\signing-report.json')
          python scripts/write_artifact_metadata.py $artifact --commit $env:GITHUB_SHA --run-id $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT --platform windows --architecture x86_64 --backend CPU --smoke-report (Join-Path $env:LOCALSR_TAURI_ROOT 'staging\package-smoke.json') --signing-report (Join-Path $env:LOCALSR_TAURI_ROOT 'staging\signing-report.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Transfer only verified release inputs
        env:
          CI_ARTIFACT_TOKEN: ${{ secrets.CI_ARTIFACT_TOKEN }}
        run: |
          $artifact = Join-Path $env:LOCALSR_TAURI_ROOT 'staging\LocalSR-v0.0.10-alpha-Windows-x86_64.exe'
          python scripts/upload_artifacts.py --server $env:CI_ARTIFACT_SERVER --run-id $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT --platform tauri-windows $artifact "$artifact.sha256" "$artifact.metadata.json" "$artifact.architecture.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove the imported certificate and bounded scratch
        if: always()
        run: |
          if ($env:LOCALSR_IMPORTED_CERTIFICATE) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:LOCALSR_IMPORTED_CERTIFICATE" -Force -ErrorAction SilentlyContinue
          }
          if ($env:LOCALSR_TAURI_ROOT -like 'C:\lsr-ci\*\tauri-release' -and (Test-Path -LiteralPath $env:LOCALSR_TAURI_ROOT)) {
            Remove-Item -LiteralPath $env:LOCALSR_TAURI_ROOT -Recurse -Force
          }

  build-macos-arm64:
    name: Build signed and notarized macOS ARM64 DMG
    if: github.ref_name != 'v0.0.10-alpha'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 300
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      PIP_CACHE_DIR: /Volumes/CISCRATCH/cache/pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Require a genuinely native Apple Silicon runner
        run: |
          test "$(uname -m)" = arm64
          python3 -c 'import platform; assert platform.machine() == "arm64", platform.machine()'
      - name: Allocate bounded guest SSD working storage
        run: |
          ROOT="/Volumes/CISCRATCH/localsr-tauri-release/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/macos-arm64"
          mkdir -p "$ROOT/tmp" "$ROOT/staging" /Volumes/CISCRATCH/cache/pip
          python3 scripts/storage_preflight.py --ssd-path /Volumes/CISCRATCH --skip-hdd --ssd-peak-gib 10
          /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -m venv "$ROOT/venv"
          {
            echo "LOCALSR_TAURI_ROOT=$ROOT"
            echo "TMPDIR=$ROOT/tmp"
            echo "CARGO_TARGET_DIR=$ROOT/cargo-target"
          } >> "$GITHUB_ENV"
          echo "$ROOT/venv/bin" >> "$GITHUB_PATH"
      - name: Install the maintained native ARM worker toolchain
        run: |
          python -c 'import platform; assert platform.machine() == "arm64"'
          python -m pip install --disable-pip-version-check "pip==${PIP_VERSION}"
          python -m pip install --disable-pip-version-check \
            "torch==${PYTORCH_VERSION}" "torchvision==${TORCHVISION_VERSION}"
          python -m pip install --disable-pip-version-check \
            -e ".[package,video]" "pyinstaller==${PYINSTALLER_VERSION}"
          python -m pip check
          python -c 'import diffusers,platform,torch; from packaging.version import Version; assert platform.machine()=="arm64"; assert Version(diffusers.__version__) >= Version("0.38.0"); assert torch.__version__.startswith("2.13.")'
          npm ci --prefix desktop
      - name: Build, sign, notarize, staple, and smoke-test the DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "Missing required signing secret: $name" >&2; exit 1; }
          done
          python scripts/build_tauri_preview.py --skip-checks --require-signing --bundles dmg
          SOURCE=$(find "$CARGO_TARGET_DIR/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg')
          test "$(printf '%s\n' "$SOURCE" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          ARTIFACT="$LOCALSR_TAURI_ROOT/staging/LocalSR-v0.0.10-alpha-macOS-arm64.dmg"
          cp "$SOURCE" "$ARTIFACT"
          python scripts/smoke_tauri_installer.py --artifact-glob "$ARTIFACT" \
            --report "$LOCALSR_TAURI_ROOT/staging/package-smoke.json"
          python scripts/verify_tauri_release_package.py "$ARTIFACT" \
            --platform macos --architecture arm64 --report "$ARTIFACT.architecture.json"
          python scripts/verify_macos_tauri_signing.py "$ARTIFACT" \
            --team-id "$APPLE_TEAM_ID" --report "$LOCALSR_TAURI_ROOT/staging/signing-report.json"
          python scripts/write_artifact_metadata.py "$ARTIFACT" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --platform macos --architecture arm64 --backend MPS \
            --smoke-report "$LOCALSR_TAURI_ROOT/staging/package-smoke.json" \
            --signing-report "$LOCALSR_TAURI_ROOT/staging/signing-report.json"
      - name: Transfer only verified release inputs
        env:
          CI_ARTIFACT_TOKEN: ${{ secrets.CI_ARTIFACT_TOKEN }}
        run: |
          ARTIFACT="$LOCALSR_TAURI_ROOT/staging/LocalSR-v0.0.10-alpha-macOS-arm64.dmg"
          python scripts/upload_artifacts.py --server "$CI_ARTIFACT_SERVER" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --platform tauri-macos \
            "$ARTIFACT" "$ARTIFACT.sha256" "$ARTIFACT.metadata.json" "$ARTIFACT.architecture.json"
      - name: Remove bounded macOS scratch
        if: always()
        run: |
          if [[ "${LOCALSR_TAURI_ROOT:-}" == /Volumes/CISCRATCH/localsr-tauri-release/*/macos-arm64 ]]; then
            rm -rf -- "$LOCALSR_TAURI_ROOT"
          fi

  publish-release:
    name: Publish compact immutable prerelease
    if: startsWith(github.ref, 'refs/tags/') && github.ref_name != 'v0.0.10-alpha'
    needs: [build-linux, build-windows, build-macos-arm64]
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare five simple user-facing assets
        run: |
          ROOT="/mnt/hdd/ci-artifacts/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          OUTPUT="$ROOT/tauri-release-assets"
          python scripts/prepare_tauri_release_assets.py "$ROOT" \
            --manifest ci/tauri-release-artifacts.json --readiness ci/beta-readiness.json \
            --tag "$GITHUB_REF_NAME" --output "$OUTPUT"
          echo "LOCALSR_RELEASE_OUTPUT=$OUTPUT" >> "$GITHUB_ENV"
      - name: Create, verify, and publish an immutable prerelease
        run: |
          TAG="$GITHUB_REF_NAME"
          TITLE="LocalSR $TAG"
          NOTES_FILE="docs/releases/$TAG.md"
          test -f "$NOTES_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; published alpha releases are immutable. Bump the version." >&2
            exit 1
          fi
          gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" \
            --verify-tag --prerelease --draft
          while IFS= read -r asset; do
            gh release upload "$TAG" "$asset"
          done < "$LOCALSR_RELEASE_OUTPUT/release-files.txt"
          VERIFY="$LOCALSR_RELEASE_OUTPUT/download-verification"
          mkdir -p "$VERIFY"
          gh release download "$TAG" --dir "$VERIFY"
          test "$(find "$VERIFY" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 5
          (cd "$VERIFY" && sha256sum --check SHA256SUMS)
          gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" \
            --draft=false --prerelease
