name: Diagnose macOS X64 runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, macOS, X64]
    steps:
      - name: Report runner and SSD scratch state without modifying it
        run: |
          uname -a
          uname -m
          sw_vers
          df -h / /Volumes/CISCRATCH
          diskutil info /Volumes/CISCRATCH
          test -r /Volumes/CISCRATCH
