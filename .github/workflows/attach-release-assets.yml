name: Attach release assets

# Copies one reviewed package artifact (packages, engine parts, checksums and source
# bundle) from a finished Linux or Windows build run to a GitHub release, inside GitHub
# rather than through a workstation. A dry run only
# prints the package's codec-policy, smoke-test and source-bundle reports for review.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run whose artifact to attach
        required: true
      artifact:
        description: Artifact name, for example linux-x86_64-cpu
        required: true
      release_tag:
        description: Release to attach the files to
        required: true
      only:
        description: Attach only the files matching this glob, for example '*source-and-notices.tar.gz'
        required: false
        default: ""
      dry_run:
        description: Only print the reports
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  attach:
    name: Attach ${{ inputs.artifact }} to ${{ inputs.release_tag }}
    runs-on: ubuntu-24.04
    steps:
      # A ROCm artifact is about 10 GB, more than the runner's root disk has spare.
      - name: Keep the download on the large disk
        run: |
          sudo mkdir -p /mnt/assets
          sudo chown "$(id -u):$(id -g)" /mnt/assets
          ln -s /mnt/assets assets
          df -h / /mnt

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: assets

      - name: Print the package reports
        run: |
          ls -la assets
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("assets").glob("*.json")):
              text = path.read_text(encoding="utf-8-sig", errors="replace")
              try:
                  data = json.loads(text)
              except ValueError:
                  # build_source_bundle.py prints its report after apt-get's output.
                  start = text.rfind("\n{")
                  try:
                      data = json.loads(text[start + 1 :]) if start >= 0 else None
                  except ValueError:
                      data = None
                  if data is None:
                      print(f"== {path.name}: not JSON")
                      continue
              print(f"== {path.name}")
              if isinstance(data, dict) and "passed" in data:
                  print("passed:", data["passed"], "failures:", data.get("failures"))
              if isinstance(data, dict) and "components" in data:
                  for name, value in data["components"].items():
                      if isinstance(value, list):
                          print(f"  {name}: {len(value)} entries")
                          for item in value:
                              print("    ", item)
                      else:
                          print(f"  {name}: {value}")
          PY

      - name: Upload packages, checksums and source bundles
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ONLY: ${{ inputs.only }}
        run: |
          shopt -s nullglob
          if [ -n "$ONLY" ]; then
            mapfile -t files < <(compgen -G "assets/$ONLY" || true)
          else
            files=(assets/*.AppImage assets/*.AppImage.part-* assets/*.exe assets/*.sha256 \
              assets/*.engine.tar.gz.part-* \
              assets/*-source-and-notices.tar.gz)
          fi
          test "${#files[@]}" -gt 0
          ls -la "${files[@]}"
          # Uploading a few hundred megabytes answers HTTP 500 ("Error creating asset temp
          # dir") or 504 often enough that one attempt is not enough. Each round uploads
          # only the files the release does not already carry at the right size, so a
          # half-finished attempt costs one round, not the whole set.
          for attempt in 1 2 3 4 5; do
            missing=()
            published=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              --jq '.assets[] | [.name, .size, .state] | @tsv')
            for file in "${files[@]}"; do
              if ! printf '%s\n' "$published" | awk -F'\t' -v n="$(basename "$file")" \
                -v s="$(stat -c %s "$file")" '$1==n && $2==s && $3=="uploaded" {found=1}
                END {exit !found}'; then
                missing+=("$file")
              fi
            done
            if [ "${#missing[@]}" -eq 0 ]; then
              echo "The release carries every file at its built size."
              exit 0
            fi
            echo "Attempt $attempt: uploading ${missing[*]}"
            gh release upload "$RELEASE_TAG" "${missing[@]}" --repo "$GITHUB_REPOSITORY" --clobber || true
            sleep 30
          done
          echo "Some files never reached $RELEASE_TAG" >&2
          exit 1
