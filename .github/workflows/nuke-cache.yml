name: Nuke Cache

on:
  push:
    branches:
      - fix/nuke-cache
  workflow_dispatch:

jobs:
  nuke:
    runs-on: [self-hosted, Linux, X64, localsr-linux-builder]
    steps:
      - name: Check sudo and ldconfig
        run: |
          sudo -n true && echo "has_passwordless_sudo=yes" || echo "has_passwordless_sudo=no"
          sudo -n ldconfig -v 2>&1 | head -5 || echo "ldconfig_sudo=no"
          sudo touch /usr/local/lib/test-write && echo "can_write=/usr/local/lib" && sudo rm /usr/local/lib/test-write || echo "cannot_write=/usr/local/lib"
