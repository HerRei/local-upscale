version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # v0.0.11's Intel-to-ARM cross build requires the exact paired Torch
    # wheels documented and tested in this one-release file. Maintained
    # platform requirements remain eligible for normal updates.
    exclude-paths:
      - "requirements/macos-cross-v0.0.11-alpha.txt"
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
