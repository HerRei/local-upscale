[project]
name = "localsr"
version = "0.0.11-alpha"
description = "A Slint desktop application for local image super-resolution using PyTorch and Spandrel."
authors = [{name = "Hermes Reisner"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["super-resolution", "upscaling", "Slint", "PyTorch", "Spandrel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "slint==1.9.2a1",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "spandrel>=0.4.0",
    "Pillow>=10.0.0",
    "rawpy>=0.25.1",
    # Current macOS Intel PyTorch wheels use the NumPy 1.x C API. NumPy 2.x
    # imports but leaves torch.from_numpy()/Tensor.numpy() unavailable.
    "numpy>=1.24.0,<2.0",
    "tifffile>=2023.0.0",
    "av>=12.0.0"
]
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/HerRei/local-upscale"
Issues = "https://github.com/HerRei/local-upscale/issues"

[project.optional-dependencies]
dev = [
    "PySide6>=6.5.0",
    "pyobjc-framework-Cocoa>=12.2.2; sys_platform == 'darwin'",
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.1.0",
]
legacy = ["PySide6>=6.5.0"]
video = [
    "omegaconf>=2.3.0",
    # Modern platforms use the release that fixes the custom-pipeline RCEs.
    "diffusers>=0.38.0,<0.39; platform_system != 'Darwin' or platform_machine != 'x86_64'",
    # Intel macOS is limited to a PyTorch build without torch.xpu, which
    # diffusers 0.36+ imports unconditionally. This legacy exception remains
    # alpha-only and is recorded as an unresolved beta security gate.
    "diffusers>=0.33.1,<0.36; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "rotary-embedding-torch>=0.5.3",
    "einops",
    "psutil",
    "tqdm",
    "gguf",
]
package = ["pyinstaller>=6.21.0,<7", "pillow>=10.0.0"]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
localsr = "localsr.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored third-party code is kept byte-faithful to upstream (Apache-2.0
# modification marking); it is not linted or reformatted.
extend-exclude = ["src/localsr/video_models/seedvr2/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
timeout = 300
timeout_method = "thread"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"localsr.ui" = ["slint/*.slint"]
"localsr.video_models.seedvr2" = [
    "*.safetensors",
    "*.md",
    "configs_3b/*.yaml",
    "configs_7b/*.yaml",
    "src/models/video_vae_v3/*.yaml",
    "vendor/LICENSE",
    "vendor/models/video_vae_v3/*.yaml",
]
