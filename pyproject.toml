[project]
name = "localsr"
version = "0.0.1"
description = "A Slint desktop application for local image super-resolution using PyTorch and Spandrel."
authors = [{name = "Hermes Reisner"}]
readme = "README.md"
license = "MIT"
keywords = ["super-resolution", "upscaling", "Slint", "PyTorch", "Spandrel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "slint==1.9.2a1",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "spandrel>=0.4.0",
    "Pillow>=10.0.0",
    "rawpy>=0.25.1",
    "numpy>=1.24.0",
    "tifffile>=2023.0.0"
]
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/HerRei/local-upscale"
Issues = "https://github.com/HerRei/local-upscale/issues"

[project.optional-dependencies]
dev = ["PySide6>=6.5.0", "pytest>=7.0.0", "pytest-qt>=4.2.0", "ruff>=0.1.0"]
legacy = ["PySide6>=6.5.0"]
package = ["pyinstaller>=6.21.0,<7", "pillow>=10.0.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
localsr = "localsr.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"localsr.ui" = ["slint/*.slint"]
